name: CarAlert APK

on:
  push:
    paths:
      - "CarAlert/**"
      - ".github/workflows/caralert.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CarAlert
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CarAlert/core

      - name: Rust 코어 테스트 + 안드로이드용 빌드
        working-directory: CarAlert/core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cargo test --quiet
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
          ls -la ../app/src/main/jniLibs/*

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../CarAlert.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAlert-apk
          path: CarAlert.apk

      - name: Publish release (폰에서 바로 다운로드용)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete caralert-latest --yes --cleanup-tag || true
          gh release create caralert-latest CarAlert.apk \
            --target "$GITHUB_SHA" \
            --title "입출차 알리미 (최신 빌드)" \
            --notes "폰에서 CarAlert.apk를 받아 설치하세요. 빌드: ${GITHUB_SHA::7}"
