    ? '자동으로 복사하지 못했어요. 아래 복사를 누르거나 내용을 직접 복사해 보관하세요.'
    : '백업을 지금 기록 위에 올립니다. 같은 날짜·항목은 백업 값으로 바뀌고, 나머지는 그대로 남아요.';
  $('confirmText').style.display = copy ? 'none' : '';
  $('copyTextBtn').style.display = copy ? '' : 'none';
  updatePreview();
  openSheet('textSheet');
}
// 붙여넣은 텍스트를 표준 { categories, snapshots } 로 바꿈. 형식이 아니면 null
function parseBackup(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ return null; }
  if(data && data.v === 2 && Array.isArray(data.c) && data.s && typeof data.s === 'object'){
    const stamp = Date.now().toString(36);
    const categories = data.c.map((name, i) => ({
      id: 'k' + i + '_' + stamp, name: String(name), color: PALETTE[i % PALETTE.length]
    }));
    const snapshots = {};
    Object.entries(data.s).forEach(([k, row]) => {
      const date = '20' + k.slice(0, 2) + '-' + k.slice(2, 4) + '-' + k.slice(4, 6);
      const snap = {};
      row.forEach((v, i) => { if(v && categories[i]) snap[categories[i].id] = v; }); // 0 = 기록 없음
      snapshots[date] = snap;
    });
    data = { categories, snapshots };
  } else if(data && data.data && typeof data.data === 'object' && !data.categories){
    data = fromLegacy(data);
  }
  return validBackup(data) ? data : null;
}
function describeBackup(text){
  const data = parseBackup(text);
  if(!data) return null;
  const dates = Object.keys(data.snapshots).sort();
  return { first: dates[0], last: dates[dates.length - 1], count: dates.length };
}
function fmtBackupRange(a, b){
  const kor = d => { const [y, m, dd] = d.split('-').map(Number); return `${y}년 ${m}월 ${dd}일`; };
  return a.slice(0, 7) === b.slice(0, 7) ? `${kor(a)} ~ ${+b.slice(8)}일` : `${kor(a)} ~ ${kor(b)}`;
}
// 붙여넣은 백업이 어느 기간의 기록인지 미리 보여줌. 올바른 백업일 때만 복원 버튼이 켜짐
function updatePreview(){
  const el = $('restorePreview'), ta = $('textArea'), ok = $('confirmText');
  if(ta.readOnly){ el.textContent = ''; return; }
  const v = ta.value.trim();
  const info = v ? describeBackup(v) : null;
  ok.disabled = !(info && info.count);
  el.className = 'preview' + (info && info.count ? '' : ' muted');
  if(!v) el.textContent = '붙여넣으면 어느 기간의 기록인지 여기에 보여요';
  else if(!info) el.textContent = '백업 데이터가 아니에요';
  else if(!info.count) el.textContent = '기록된 날짜가 없어요';
  else el.textContent = `${fmtBackupRange(info.first, info.last)}, 기록 ${info.count}일`;
}
// 백업 형식 v2: { v:2, c:[항목이름...], s:{ "YYMMDD":[항목 순서대로 금액 또는 0] } }
// 뒤쪽 0은 잘라서 더 짧게. 색·ID는 저장하지 않고 복원 때 새로 만듦. ym이 비면 전체
function buildPayload(ym){
  const dates = sortedDates().filter(d => !ym || d.startsWith(ym));
  const used = state.categories.filter(c => dates.some(d => state.snapshots[d][c.id] !== undefined));
  const s = {};
  dates.forEach(d => {
    const row = used.map(c => state.snapshots[d][c.id] ?? 0);
    while(row.length && row[row.length - 1] === 0) row.pop();
    s[d.slice(2).replace(/-/g, '')] = row;
  });
  return JSON.stringify({ v: 2, c: used.map(c => c.name), s });
}
// 백업 복사: 기간 목록 (전체 + 달별) → 누르면 바로 복사
function copyBackup(){
  const dates = sortedDates();
  if(!dates.length){ snack('복사할 기록이 없어요'); return; }
  const counts = {};
  dates.forEach(d => { const ym = d.slice(0, 7); counts[ym] = (counts[ym] || 0) + 1; });
  const yms = Object.keys(counts).sort().reverse();
  const years = new Set(yms.map(ym => ym.slice(0, 4)));
  const options = [{ value: '', label: '전체 기간', detail: `${dates.length}일` }].concat(yms.map(ym => {
    const [y, m] = ym.split('-');
    return { value: ym, label: years.size > 1 ? `${y}년 ${Number(m)}월` : `${Number(m)}월`, detail: `${counts[ym]}일` };
  }));
  pickOption({ title: '백업 복사', hint: '기간을 고르면 그 기간의 기록이 클립보드에 복사돼요.', options, onPick: async ym => {
    const text = buildPayload(ym);
    try{
      await navigator.clipboard.writeText(text);
      haptic();
      snack('백업을 복사했어요');
    }catch(e){
      openText('copy', text);
    }
  } });
}
async function copyTextBox(){
  const ta = $('textArea');
  try{
    await navigator.clipboard.writeText(ta.value);
    snack('백업을 복사했어요');
  }catch(e){
    ta.select();
    try{ document.execCommand('copy'); snack('백업을 복사했어요'); }
    catch(err){ snack('복사하지 못했어요. 내용을 길게 눌러 직접 복사해 주세요', { ms: 3500 }); }
  }
}
function validBackup(o){
  return o && Array.isArray(o.categories) && o.snapshots && typeof o.snapshots === 'object' &&
    o.categories.every(c => c && typeof c.id === 'string' && typeof c.name === 'string') &&
    Object.values(o.snapshots).every(s => s && typeof s === 'object');
}
// 이전 버전 형식 변환: { data: { "날짜": [{id, name, amount}] } } — 이름 기준으로 묶음
function fromLegacy(o){
  const categories = [];
  const idMap = {};
  const snapshots = {};
  Object.keys(o.data).sort().forEach(date => {
    const items = Array.isArray(o.data[date]) ? o.data[date] : [];
    const snap = {};
    items.forEach(it => {
      const name = String(it.name || '').trim();
      if(!name) return;
      if(!idMap[name]){
        const newId = 'c' + categories.length + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        idMap[name] = newId;
        categories.push({ id: newId, name, color: PALETTE[categories.length % PALETTE.length] });
      }
      const amt = Number(it.amount);
      if(!isNaN(amt)) snap[idMap[name]] = Math.round(amt);
    });
    if(Object.keys(snap).length) snapshots[date] = snap;
  });
  return { categories, snapshots };
}
// 기존 데이터 위에 올림. 결과(날짜 수, 추가/변경 건수, 새 항목 수)를 돌려줌
function mergeBackup(inc){
  const idMap = {};
  let newCats = 0;
  inc.categories.forEach(c => {
    let ex = state.categories.find(x => x.name === c.name) || state.categories.find(x => x.id === c.id);
    if(!ex){
      ex = { id: c.id, name: c.name, color: c.color || PALETTE[state.categories.length % PALETTE.length] };
      if(state.categories.some(x => x.id === ex.id)) ex.id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      state.categories.push(ex);
      newCats++;
    }
    idMap[c.id] = ex.id;
  });
  let added = 0, updated = 0;
  const dates = Object.keys(inc.snapshots);
  dates.forEach(date => {
    const target = { ...(state.snapshots[date] || {}) };
    Object.keys(inc.snapshots[date]).forEach(cid => {
      const nid = idMap[cid];
      if(!nid) return;
      const val = Number(inc.snapshots[date][cid]);
      const before = target[nid];
      if(before === undefined) added++;
      else if(before !== val) updated++;
      target[nid] = val;
    });
    state.snapshots[date] = target;
  });
  return { dates: dates.length, added, updated, newCats };
}
// 복원은 바로 적용하고, 잠깐 동안 되돌릴 수 있음
function restore(){
  const data = parseBackup($('textArea').value);
  if(!data){ snack('백업 데이터가 아니에요'); return; }
  const before = JSON.stringify(state);
  const r = mergeBackup(data);
  consolidate();
  closeSheet('textSheet');
  haptic();
  view.anchor = null;
  commit();
  const extra = r.newCats ? `, 새 항목 ${r.newCats}개` : '';
  snack(`복원했어요. ${r.dates}일, 추가 ${r.added}건, 변경 ${r.updated}건${extra}`, { ms: 9000, action: { label: '되돌리기', fn: () => {
    state = JSON.parse(before);
    view.anchor = null;
    commit();
  } } });
}
async function clearAll(){
  if(!await ask('모든 기록과 항목을 지울까요?\n지운 뒤에는 되돌릴 수 없어요.', '모두 지우기')) return;
  state = { categories: [], snapshots: {} };
  view.anchor = null;
  commit();
  snack('모두 지웠어요');
}

/* ---------- 이벤트: 기간 알약 ----------
   누르면 알약이 손가락을 따라오고(빠를수록 가로로 늘어남), 놓으면 가까운 칸에 붙음 */
const RANGES = ['1w', '1m', 'all'];
const segEl = $('rangeSeg'), segThumb = segEl.querySelector('.seg-thumb');
let segDrag = null, segPointerAt = 0;
const segTW = () => segEl.clientWidth / 3;
function placeSeg(x, sx = 1, sy = 1){
  if(x === undefined) x = RANGES.indexOf(view.range) * segTW();
  segThumb.style.transform = `translateX(${x.toFixed(2)}px) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
}
function syncSeg(hot){
  const on = hot === undefined ? view.range : RANGES[hot];
  segEl.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.range === on);
    b.setAttribute('aria-selected', b.dataset.range === view.range);
  });
}
function setRange(range){
  if(range === view.range){ syncSeg(); return; }
  view.range = range;
  view.anchor = null;
  syncSeg();
  renderSummary();
  renderChart();
  wipeChart();
}
function segTick(){
  const s = segDrag;
  if(!s) return;
  const prev = s.cur;
  s.cur += (s.target - s.cur) * .34; // 손가락을 반 박자 늦게 따라옴
  s.v = s.v * .7 + (s.cur - prev) * .3;
  const st = Math.min(Math.abs(s.v) * .022, .22);
  placeSeg(s.cur, 1.06 + st, 1.06 - st * .5);
  const hot = Math.max(0, Math.min(2, Math.round(s.cur / segTW())));
  if(hot !== s.hot){ s.hot = hot; syncSeg(hot); haptic(); }
  s.raf = requestAnimationFrame(segTick);
}
const segTarget = (clientX, s) => Math.max(0, Math.min(segTW() * 2, clientX - segEl.getBoundingClientRect().left - s.grab));
segEl.addEventListener('pointerdown', e => {
  if(e.button > 0) return;
  const tw = segTW(), idx = RANGES.indexOf(view.range);
  const px = e.clientX - segEl.getBoundingClientRect().left;
  const onThumb = px >= idx * tw && px <= (idx + 1) * tw;
  segDrag = { id: e.pointerId, x0: e.clientX, cur: idx * tw, v: 0, hot: idx, raf: 0, grab: onThumb ? px - idx * tw : tw / 2 };
  segDrag.target = segTarget(e.clientX, segDrag);
  try{ segEl.setPointerCapture(e.pointerId); }catch(err){}
  segThumb.style.transition = 'none';
  segDrag.raf = requestAnimationFrame(segTick);
});
segEl.addEventListener('pointermove', e => {
  if(segDrag && segDrag.id === e.pointerId) segDrag.target = segTarget(e.clientX, segDrag);
});
function segRelease(e, cancel){
  const s = segDrag;
  if(!s || (e && s.id !== e.pointerId)) return;
  segDrag = null;
  cancelAnimationFrame(s.raf);
  segPointerAt = performance.now();
  const tw = segTW();
  const tap = e && Math.abs(e.clientX - s.x0) < 6;
  const base = cancel ? RANGES.indexOf(view.range) * tw : tap ? s.target : s.target + s.v * 8; // 놓는 속도만큼 더 나아간 자리
  const idx = Math.max(0, Math.min(2, Math.round(base / tw)));
  segThumb.style.transition = '';
  placeSeg(idx * tw);
  if(RANGES[idx] !== view.range && s.hot !== idx) haptic();
  setRange(RANGES[idx]);
}
segEl.addEventListener('pointerup', e => segRelease(e, false));
segEl.addEventListener('pointercancel', e => segRelease(e, true));
segEl.addEventListener('click', e => { // 키보드로 누를 때 (포인터로 누른 직후의 클릭은 무시)
  if(performance.now() - segPointerAt < 500) return;
  const b = e.target.closest('button[data-range]');
  if(!b) return;
  setRange(b.dataset.range);
  placeSeg();
});

/* ---------- 이벤트: 그래프 ----------
   탭 = 가장 가까운 기록 고르기(다시 누르면 해제) / 좌우로 끌기 = 기간 넘기기 / 길게 눌러 끌기 = 훑어보기 (전체 보기는 바로 훑기) */
let d0, drag = null, settling = false, sharedR = null, suppressClick = false, scrubbing = false, holdT = 0;
const trackOffset = () => -(+track.dataset.c) * 100 / (+track.dataset.n);
// 끄는 동안에는 세 기간이 같은 높이 기준을 써서 선이 이어져 보임
function beginShared(){
  const anchors = panelAnchors();
  const own = anchors.map(yRangeOf);
  sharedR = own[1];
  if(!sharedR) return;
  const token = ++tweenToken;
  const start = performance.now(), dur = 200;
  const step = now => {
    if(token !== tweenToken) return;
    const t = Math.min(1, (now - start) / dur);
    const k = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    [0, 2].forEach(i => {
      const f = own[i];
      if(f) layoutPanel(track.children[i], anchors[i], { min: f.min + (sharedR.min - f.min) * k, max: f.max + (sharedR.max - f.max) * k }, false);
    });
    if(t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
// 놓은 뒤: 새로 가운데 오는 기간의 높이 기준으로 부드럽게 맞추며 자리에 붙음
function settle(dir){
  settling = true;
  const n = +track.dataset.n, c = +track.dataset.c;
  const ms = reduceMotion() ? 0 : 360;
  const center = activeAnchor();
  const next = dir ? shiftAnchor(center, dir) : center;
  track.style.transition = ms ? `transform ${ms}ms ${SMOOTH}` : 'none';
  track.style.transform = `translateX(${-((c + dir) * 100 / n)}%)`;
  const from = sharedR || yRangeOf(center);
  const to = yRangeOf(next) || from;
  if(from && to) tweenRange(from, to, ms, yr => layoutPanel(track.children[c + dir], next, yr, false));
  if(dir) haptic();
  settleNext = dir ? next : null;
  settleT = setTimeout(finishSettle, ms + 10);
}
let settleT = 0, settleNext = null;
function finishSettle(){
  clearTimeout(settleT);
  settling = false;
  sharedR = null;
  if(settleNext){ view.anchor = settleNext; renderSummary(); } // 고른 날은 기간을 넘겨도 그대로 유지
  settleNext = null;
  renderChart();
}
// 넘어가는 중에 다시 잡으면: 지금 보이는 자리에서 이어서 끌 수 있게 함
function grabSettling(){
  const m = new DOMMatrix(getComputedStyle(track).transform);
  const curX = m.m41;
  tweenToken++;
  finishSettle();
  const cs = new DOMMatrix(getComputedStyle(track).transform);
  return curX - cs.m41;
}
function scrubTo(clientX){
  const best = nearestPoint(clientX);
  if(!best || best.d === view.point) return;
  const first = !view.point;
  view.point = best.d; view.unpicked = false;
  renderSummary(true); // 훑는 동안 숫자는 굴리지 않고 바로 바꿈
  placeCursor(true, !first);
}
function startScrub(clientX){
  if(!drag || !chartPts.length) return;
  scrubbing = true;
  try{ chartArea.setPointerCapture(drag.id); }catch(err){}
  haptic();
  scrubTo(clientX);
}
chartArea.addEventListener('pointerdown', e => {
  if(e.button > 0 || settling) return; // 넘어가는 중에는 새 스와이프를 받지 않음
  suppressClick = false;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, lt: e.timeStamp, v: 0, dx: 0, eff: 0, base: 0, cur: 0, target: 0, raf: 0, ft: 0, moved: false };
  clearTimeout(holdT);
  const x0 = e.clientX;
  holdT = setTimeout(() => { if(drag && !drag.moved) startScrub(x0); }, 300);
});
chartArea.addEventListener('pointermove', e => {
  const d = drag;
  if(!d || d.id !== e.pointerId) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  const dt = e.timeStamp - d.lt;
  if(dt > 0) d.v = (e.clientX - d.lx) / dt;
  d.lx = e.clientX; d.lt = e.timeStamp;
  if(scrubbing){ scrubTo(e.clientX); return; }
  if(!d.moved){
    if(Math.hypot(dx, dy) > 8) clearTimeout(holdT);
    if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ drag = null; return; } // 세로 = 화면 스크롤
    if(Math.abs(dx) < 8) return;
    d.moved = true;
    try{ chartArea.setPointerCapture(e.pointerId); }catch(err){}
    if(view.range === 'all'){ startScrub(e.clientX); return; }
    beginShared();
  }
  if(Math.abs(dx) > 6) d.touched = true;
  d.dx = dx + (d.base || 0);
  d.eff = canShift(d.dx < 0 ? 1 : -1) ? d.dx : d.dx * .22; // 기록이 없는 쪽으로는 고무줄처럼 조금만
  d.target = d.cur = d.eff;
  track.style.transition = 'none';
  track.style.transform = `translateX(calc(${trackOffset()}% + ${d.eff}px))`;
});
// 손가락 위치를 그대로 따라붙지 않고 부드럽게 쫓아감 → 움직이는 그래프를 잡아도 끊기지 않고 이어서 끌려 옴
function followTick(d, t){
  d.raf = 0;
  if(drag !== d || scrubbing) return;
  const dt = Math.min(48, d.ft ? t - d.ft : 16); d.ft = t;
  const diff = d.target - d.cur;
  d.cur = Math.abs(diff) < .3 ? d.target : d.cur + diff * (1 - Math.exp(-dt / 55));
  track.style.transition = 'none';
  track.style.transform = `translateX(calc(${trackOffset()}% + ${d.cur.toFixed(2)}px))`;
  if(d.cur !== d.target || d.moved) d.raf = requestAnimationFrame(tt => followTick(d, tt));
}
function stopFollow(d){
  if(!d) return;
  cancelAnimationFrame(d.raf); d.raf = 0;
  if(d.moved && !scrubbing && d.cur !== undefined && view.range !== 'all'){
    track.style.transition = 'none';
    track.style.transform = `translateX(calc(${trackOffset()}% + ${d.cur.toFixed(2)}px))`;
    void track.offsetWidth;
  }
}
function chartRelease(){
  clearTimeout(holdT);
  const d = drag;
  drag = null;
  stopFollow(d);
  if(scrubbing){
    scrubbing = false;
    suppressClick = true;
    const wrap = centerPanel() && centerPanel().querySelector('.pwrap');
    if(wrap) wrap.classList.remove('scrub');
    return;
  }
  if(!d || !d.moved) return;
  suppressClick = true;
  if(view.range === 'all') return;
  if(d.base && !d.touched){ settle(0); return; } // 넘어가는 중 가만히 잡았다 놓음 → 가던 자리로 마저 감
  const dir = d.dx < 0 ? 1 : -1;
  const far = Math.abs(d.dx) > chartArea.clientWidth * .06;
  const flick = Math.abs(d.v) > .3 && d.v * d.dx > 0;
  settle(canShift(dir) && (far || flick) ? dir : 0);
}
chartArea.addEventListener('pointerup', chartRelease);
chartArea.addEventListener('pointercancel', chartRelease); // 브라우저가 스크롤을 가져가도 움직인 만큼으로 넘김/복귀를 정함
chartArea.addEventListener('click', e => {
  if(suppressClick){ suppressClick = false; return; }
  const best = nearestPoint(e.clientX);
  if(!best) return;
  view.unpicked = view.point === best.d;
  view.point = view.unpicked ? null : best.d;
  haptic();
  renderSummary();
  placeCursor(true);
});
// 가로로 끌거나 훑는 동안에는 화면이 세로로 딸려 가지 않도록
chartArea.addEventListener('touchmove', e => { if(scrubbing || (drag && drag.moved)) e.preventDefault(); }, { passive: false });
chartArea.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 이벤트: 달력 ----------
   좌우로 끌면 옆 달이 함께 따라오고, 기준을 넘기거나 빠르게 튕기면 그 달로 넘어감 */
calClip.addEventListener('pointerdown', e => {
  if(calBusy || e.button > 0) return;
  calDrag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, moved: false, lx: e.clientX, lt: e.timeStamp, v: 0 };
});
calClip.addEventListener('pointermove', e => {
  const c = calDrag;
  if(!c || c.id !== e.pointerId) return;
  const dx = e.clientX - c.x, dy = e.clientY - c.y;
  if(!c.moved){
    if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ calDrag = null; return; }
    if(Math.abs(dx) < 8) return;
    c.moved = true;
    try{ calClip.setPointerCapture(e.pointerId); }catch(err){}
  }
  const dt = e.timeStamp - c.lt;
  if(dt > 0) c.v = (e.clientX - c.lx) / dt;
  c.lx = e.clientX; c.lt = e.timeStamp;
  c.dx = dx;
  ensurePeek(dx < 0 ? 1 : -1);
  calPages.style.transition = 'none';
  calPages.style.transform = `translateX(${dx}px)`;
});
function calRelease(){
  const c = calDrag;
  calDrag = null;
  if(!c || !c.moved) return;
  calSuppressAt = performance.now(); // 끈 직후의 날짜 탭은 무시
  const dir = c.dx < 0 ? 1 : -1;
  const flick = Math.abs(c.dx) > 20 && c.v * dir < -.4;
  finishCal(!!calPeek && calPeek._dir === dir && (Math.abs(c.dx) > calPages.clientWidth * .2 || flick));
}
calClip.addEventListener('pointerup', calRelease);
calClip.addEventListener('pointercancel', calRelease);
calClip.addEventListener('touchmove', e => { if(calDrag && calDrag.moved) e.preventDefault(); }, { passive: false });
calPages.addEventListener('click', e => {
  if(calBusy || performance.now() - calSuppressAt < 300) return;
  const b = e.target.closest('button[data-date]');
  if(!b) return;
  if(b.dataset.date !== view.selected) haptic();
  selectDate(b.dataset.date);
});
$('calPrev').onclick = () => calGo(monthShift(view.month, -1));
$('calNext').onclick = () => calGo(monthShift(view.month, 1));
$('todayBtn').onclick = goToday;

/* ---------- 이벤트: 항목 줄 ----------
   탭 = 그 자리에서 고치기 / 왼쪽으로 밀기 = 삭제 버튼 (버튼에서 멈추고, 눌러야 지워짐) / 길게 눌러 끌기 = 순서 바꾸기 */
const ACT_W = 76, HOLD_MS = 450;
let rowDrag = null, rowSuppressAt = 0, openRow = null, holdTimer = null, reorder = null;
const liveItems = () => dayClip.querySelector('.day-pane:not(.leaving) .items');
function setRowX(row, x, animate){
  const fg = row.querySelector('.item-fg');
  if(!fg) return;
  fg.style.transition = animate ? `transform .46s ${SPRING}` : 'none';
  fg.style.transform = x ? `translateX(${x.toFixed(1)}px)` : '';
  clearTimeout(row._sw);
  if(x) row.classList.add('swiping');
  else if(animate) row._sw = setTimeout(() => row.classList.remove('swiping'), 470);
  else row.classList.remove('swiping');
}
function closeOpenRow(){
  if(!openRow) return;
  if(openRow.isConnected) setRowX(openRow, 0, true);
  openRow = null;
}
let pendingEdit = null;
dayClip.addEventListener('pointerdown', e => {
  rowDrag = null;
  const act = document.activeElement;
  if(act && act.classList.contains('inline-in') && !e.target.closest('input')){
    const f = e.target.closest('.item-val, .nm'), r = e.target.closest('.item[data-row]');
    if(f && r){
      e.preventDefault(); // 브라우저가 포커스를 옮기며 새 입력칸을 닫지 않도록
      pendingEdit = { cid: r.dataset.row, kind: f.classList.contains('nm') ? 'nm' : 'val' };
      rowSuppressAt = performance.now();
      act.blur();
      return;
    }
  }
  if(reorder || e.button > 0 || e.target.closest('input, button')) return;
  const row = e.target.closest('.item[data-row]');
  if(!row) return;
  if(openRow && openRow !== row){ closeOpenRow(); rowSuppressAt = performance.now(); return; } // 다른 줄이 열려 있으면 그것만 닫음
  const base = openRow === row ? -ACT_W : 0;
  rowDrag = { row, id: e.pointerId, x: e.clientX, y: e.clientY, base, cur: base, moved: false, cid: row.dataset.row, lx: e.clientX, lt: e.timeStamp, vx: 0, past: !!base };
  clearTimeout(holdTimer);
  if(!base){
    const y0 = e.clientY, id = e.pointerId;
    holdTimer = setTimeout(() => startReorder(row, id, y0), HOLD_MS);
  }
});
dayClip.addEventListener('pointermove', e => {
  if(reorder && reorder.id === e.pointerId){ reorder.lastY = e.clientY; updateReorder(); return; }
  const d = rowDrag;
  if(!d || d.id !== e.pointerId) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if(holdTimer && Math.hypot(dx, dy) > 8){ clearTimeout(holdTimer); holdTimer = null; } // 움직이면 길게 누르기 취소
  if(!d.moved){
    if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ rowDrag = null; return; } // 세로 = 화면 스크롤
    if(Math.abs(dx) < 10) return;
    d.moved = true;
    try{ d.row.setPointerCapture(e.pointerId); }catch(err){}
  }
  const dt = e.timeStamp - d.lt;
  if(dt > 0) d.vx = (e.clientX - d.lx) / dt;
  d.lx = e.clientX; d.lt = e.timeStamp;
  let x = d.base + dx;
  if(x > 0) x = Math.pow(x, .55);                               // 오른쪽으로는 고무줄처럼 조금만
  else if(x < -ACT_W) x = -ACT_W - Math.pow(-x - ACT_W, .72);   // 버튼 폭을 넘으면 버팀 → 길게 밀어도 바로 지워지지 않음
  d.cur = x;
  const past = x <= -ACT_W + 1;
  if(past !== d.past){ d.past = past; if(past) haptic(); }
  setRowX(d.row, x, false);
});
dayClip.addEventListener('pointerup', e => {
  clearTimeout(holdTimer); holdTimer = null;
  if(reorder && reorder.id === e.pointerId){ endReorder(true); return; }
  const d = rowDrag;
  rowDrag = null;
  if(!d || d.id !== e.pointerId) return;
  if(!d.moved){
    if(d.base){ closeOpenRow(); rowSuppressAt = performance.now(); } // 열린 줄을 탭하면 닫기만
    return;
  }
  rowSuppressAt = performance.now();
  const open = d.vx < -.3 ? true : d.vx > .3 ? false : d.cur < -ACT_W / 2;
  setRowX(d.row, open ? -ACT_W : 0, true);
  if(open) openRow = d.row;
  else if(openRow === d.row) openRow = null;
});
dayClip.addEventListener('pointercancel', () => {
  clearTimeout(holdTimer); holdTimer = null;
  if(reorder){ endReorder(false); return; }
  const d = rowDrag;
  rowDrag = null;
  if(d && d.moved) setRowX(d.row, d.base, true);
});
dayClip.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if(act){ if(act.dataset.act === 'more') dayMore(); else carryOver(); return; }
  const del = e.target.closest('.act-del');
  if(del){
    const row = del.closest('.item');
    openRow = null;
    collapseRow(row, row.dataset.row);
    return;
  }
  if(e.target.closest('input') || performance.now() - rowSuppressAt < 400) return;
  if(openRow){ closeOpenRow(); return; }
  const val = e.target.closest('.item-val');
  if(val) return startValueEdit(val);
  const nm = e.target.closest('.nm');
  if(nm) return startNameEdit(nm);
  const row = e.target.closest('.item[data-row]');
  if(row){ haptic(); openTrend(row.dataset.row); }
});
// 열린 삭제 버튼 바깥을 누르면 닫힘
document.addEventListener('click', e => {
  if(!openRow || e.target.closest('.hap')) return;
  if(!openRow.contains(e.target)) closeOpenRow();
});
dayClip.addEventListener('contextmenu', e => { if(e.target.closest('.item')) e.preventDefault(); });

/* ---------- 길게 눌러 순서 바꾸기 ---------- */
function startReorder(row, id, y0){
  holdTimer = null;
  rowDrag = null;
  if(!row.isConnected) return;
  closeOpenRow();
  const rows = [...liveItems().querySelectorAll('.item[data-row]')];
  const others = rows.filter(x => x !== row);
  reorder = {
    row, id, y0Page: y0 + scrollY, lastY: y0, cid: row.dataset.row, to: null, raf: 0,
    from: rows.indexOf(row), others, pitch: row.offsetHeight,
    baseTop: row.getBoundingClientRect().top + scrollY,
    // 움직이기 전 원래 자리의 중앙 (비켜 주는 중인 줄의 위치에 영향받지 않도록 미리 측정)
    mids: others.map(x => { const rc = x.getBoundingClientRect(); return rc.top + scrollY + rc.height / 2; })
  };
  others.forEach(x => { x.style.transition = `transform .42s ${SPRING}`; });
  dayClip.classList.add('reordering');
  const fg = row.querySelector('.item-fg');
  fg.style.transition = ''; fg.style.transform = '';
  row.classList.remove('swiping');
  row.style.transition = 'none';
  row.classList.add('lifted');
  haptic();
  try{ row.setPointerCapture(id); }catch(err){}
  reorder.raf = requestAnimationFrame(autoScroll);
}
// 끌고 있는 줄의 현재 중심으로 들어갈 자리를 정하고, 나머지 줄은 그 자리를 비켜 줌
function updateReorder(){
  const r = reorder;
  const raw = r.lastY + scrollY - r.y0Page;
  const minDy = -r.from * r.pitch, maxDy = r.others.length * r.pitch - r.from * r.pitch;
  const rub = o => 22 * (1 - Math.exp(-o / 60)); // 목록 끝을 넘으면 최대 22px까지만 버티며 따라옴
  const dy = raw < minDy ? minDy - rub(minDy - raw) : raw > maxDy ? maxDy + rub(raw - maxDy) : raw;
  r.dy = dy; r.minDy = minDy; r.maxDy = maxDy;
  r.row.style.transform = `translateY(${dy}px)`;
  const center = r.baseTop + r.pitch / 2 + dy;
  const idx = r.mids.findIndex(m => center < m);
  const to = idx === -1 ? r.others.length : idx;
  if(r.to !== null && to !== r.to) haptic();
  r.to = to;
  r.others.forEach((x, j) => {
    const origSlot = j < r.from ? j : j + 1;
    const finalSlot = j < r.to ? j : j + 1;
    x.style.transform = finalSlot === origSlot ? '' : `translateY(${(finalSlot - origSlot) * r.pitch}px)`;
  });
}
// 손가락이 화면 위·아래 가장자리에 있으면 화면이 따라 스크롤
function autoScroll(){
  const r = reorder;
  if(!r) return;
  const E = 90, h = innerHeight;
  let v = 0;
  const se = document.scrollingElement;
  // 줄이 목록 끝에 닿았거나 화면이 더 스크롤될 수 없으면 멈춤 (끝에서 덜컥거리지 않도록)
  if(r.lastY < E && r.dy > r.minDy && scrollY > 0) v = -(E - r.lastY) / E * 14;
  else if(r.lastY > h - E && r.dy < r.maxDy && scrollY + h < se.scrollHeight - 1) v = (r.lastY - (h - E)) / E * 14;
  v = Math.round(v);
  if(v){ window.scrollBy(0, v); updateReorder(); }
  r.raf = requestAnimationFrame(autoScroll);
}
// 순서 확정: 보이는 항목들의 자리(state.categories 안의 칸)만 새 순서로 채움. 보이지 않는 항목은 그대로
function endReorder(commitOrder){
  const r = reorder;
  reorder = null;
  cancelAnimationFrame(r.raf);
  setTimeout(() => dayClip.classList.remove('reordering'), canMove() ? 360 : 0);
  rowSuppressAt = performance.now(); // 직후 발생하는 클릭(이름 고치기 등) 무시
  const settleMs = canMove() ? 340 : 0;
  r.row.classList.remove('lifted');
  r.row.style.transition = settleMs ? `transform ${settleMs}ms ${SPRING}` : 'none';
  if(!commitOrder || r.to === null || r.to === r.from){
    r.row.style.transform = '';
    r.others.forEach(x => { x.style.transform = ''; });
    setTimeout(() => renderDay(0), settleMs);
    return;
  }
  const ids = r.others.map(x => x.dataset.row);
  ids.splice(r.to, 0, r.cid);
  const visible = new Set(ids);
  const slots = [];
  state.categories.forEach((c, i) => { if(visible.has(c.id)) slots.push(i); });
  const byId = Object.fromEntries(state.categories.map(c => [c.id, c]));
  ids.forEach((id, k) => { state.categories[slots[k]] = byId[id]; });
  // 끌던 줄을 놓을 자리에 내려놓은 뒤 저장하고 다시 그림 (나머지 줄은 이미 그 자리에 있음)
  r.row.style.transform = `translateY(${(r.to - r.from) * r.pitch}px)`;
  setTimeout(() => { save(); renderDay(0); }, settleMs);
}
// 순서를 바꾸는 중에는 브라우저가 화면을 스크롤하지 못하게 막음 (passive:false 여야 막을 수 있음)
dayClip.addEventListener('touchmove', e => { if(reorder || (rowDrag && rowDrag.moved)) e.preventDefault(); }, { passive: false });

/* ---------- 이벤트: 항목 추가 ----------
   '항목 추가' 줄이 그 자리에서 입력 줄로 바뀜 (키보드는 자동으로 올리지 않음) */
const adder = $('adder'), newName = $('newName'), newAmt = $('newAmt'), addOk = $('addOk');
function setAdder(open){
  if(adder.classList.contains('open') === open) return;
  const h0 = adder.offsetHeight;
  if(!open){
    [newName, newAmt].forEach(i => { i.blur(); i.value = ''; });
    syncAddOk();
  }
  adder.classList.toggle('open', open);
  const h1 = adder.offsetHeight;
  if(canMove()) anim(adder, [{ height: h0 + 'px' }, { height: h1 + 'px' }], { duration: 380, easing: SMOOTH });
}
function syncAddOk(){ addOk.disabled = !(newName.value.trim() && /\d/.test(newAmt.value)); }
$('addOpen').onclick = () => setAdder(true);
$('addCancel').onclick = () => setAdder(false);
addOk.onclick = () => {
  if(addOk.disabled || !addEntry()) return;
  haptic();
  setAdder(false);
  commit();
};
newName.addEventListener('input', syncAddOk);
newAmt.addEventListener('input', () => { fmtAmtInput(newAmt); syncAddOk(); });
newName.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); newAmt.focus(); }
  if(e.key === 'Escape') setAdder(false);
});
newAmt.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); addOk.click(); }
  if(e.key === 'Escape') setAdder(false);
});

/* ---------- 이벤트: 아래쪽 메뉴와 판 ---------- */
$('btnSave').onclick = copyBackup;
$('btnRestore').onclick = () => openText('restore');
$('btnReset').onclick = clearAll;
$('optCancel').onclick = () => closeSheet('optSheet');
$('trendClose').onclick = () => closeSheet('trendSheet');
$('cancelText').onclick = () => closeSheet('textSheet');
$('confirmText').onclick = restore;
$('copyTextBtn').onclick = copyTextBox;
$('textArea').addEventListener('input', updatePreview);
sheetDrag('optSheet', () => closeSheet('optSheet'));
sheetDrag('trendSheet', () => closeSheet('trendSheet'));
sheetDrag('textSheet', () => closeSheet('textSheet'));
sheetDrag('confirmSheet', () => { if(askCancel) askCancel(); });
// Esc: 가장 위에 열린 것부터 닫음
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('confirmSheet').classList.contains('show')){ if(askCancel) askCancel(); return; }
  for(const id of ['textSheet', 'optSheet', 'trendSheet']){
    if($(id).classList.contains('show')){ closeSheet(id); return; }
  }
});
// :active 눌림 표시가 아이폰에서도 보이도록
document.addEventListener('touchstart', () => {}, { passive: true });

/* ---------- 화면 크기 · 키보드 ---------- */
let resizeRaf = 0, lastW = innerWidth;
addEventListener('resize', () => {
  if(innerWidth === lastW) return; // 주소창이 접히며 높이만 바뀐 경우는 그대로 둠
  lastW = innerWidth;
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    chartScaleCache = null;
    if(!settling && !drag) renderChart();
    if(calCur && !calBusy) placeMark(calCur, false);
    if(!segDrag){ segThumb.style.transition = 'none'; placeSeg(); void segThumb.offsetWidth; segThumb.style.transition = ''; }
    fitHero();
  });
});
// 키보드가 올라오면 visualViewport가 줄어듦. 그만큼을 --kb로 넘겨 아래쪽 요소·본문·판이 같이 올라가게 함
const vv = window.visualViewport;
let lastKb = 0;
function syncKeyboard(){
  if(!vv) return;
  const el = document.activeElement;
  const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
  // 입력 중일 때만 키보드 높이를 셈. 스크롤 끝에서 튕기는 동안 매번 화면을 다시 배치하지 않도록 바뀔 때만 적용
  const kb = typing ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
  if(kb === lastKb) return;
  document.documentElement.style.setProperty('--kb', kb + 'px');
  if(kb > lastKb && el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && !el.closest('.sheet-bg')){
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  lastKb = kb;
}
if(vv){
  vv.addEventListener('resize', syncKeyboard);
  vv.addEventListener('scroll', syncKeyboard);
}

/* ---------- 시작 ---------- */
let state = load();
if(consolidate()) save();
const now0 = new Date();
const view = { month: new Date(now0.getFullYear(), now0.getMonth(), 1), selected: ymd(now0), range: '1w', point: null, anchor: null, flash: null };
// 처음에는 오늘(오늘 기록이 없으면 그 전 마지막 기록)을 고른 상태로 시작
view.point = [...sortedDates()].filter(d => d <= ymd(now0)).pop() || null;

syncSeg();
placeSeg();
renderSummary();
renderChart();
renderCalendar();
renderDay(0);
uiReady = true;
wipeChart(); // 처음 한 번, 선이 왼쪽부터 그려짐
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitHero); // 글꼴이 늦게 오면 다시 맞춤
</script>
