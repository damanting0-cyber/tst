<!-- 아이폰은 기본 글꼴(SF)을 쓰고, 다른 기기에서만 가장 닮은 Pretendard를 씀. 못 받아와도 화면은 그대로 뜸 -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ---------- 종이 한 장 ----------
   흰 바탕에 검은 잉크만 (다크 모드는 반대). 카드·그림자 없이 여백과 가는 선으로 구역을 나눔.
   선택된 것은 언제나 '꽉 찬 잉크': 기간 알약 · 달력 표식 · 들어 올린 줄
   움직임 규칙: ① 사라질 때 흐려지지 않고 밀려 나가거나 접힘 ② 숫자는 굴러서 바뀜 ③ 끌 때는 손가락을 그대로 따라감 */
:root{
  color-scheme:light dark;
  --paper:#fff; --ink:#000; --ink2:#707070; --ink3:#b6b6b6; --rule:#e8e8e8; --wash:#f3f3f3;
  --raised:#fff; --dim:rgba(0,0,0,.34);
  --pad:24px;
  --spring:cubic-bezier(.3,1.3,.5,1);   /* 살짝 넘쳤다 돌아오는 도착 */
  --smooth:cubic-bezier(.22,1,.36,1);   /* 넘침 없이 부드럽게 멈춤 */
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#000; --ink:#fff; --ink2:#8e8e8e; --ink3:#555; --rule:#242424; --wash:#161616;
    --raised:#151515; --dim:rgba(0,0,0,.62);
  }
}
@supports (transition-timing-function: linear(0, 1)){
  :root{
    --spring:linear(0, 0.028, 0.098, 0.195, 0.304, 0.417, 0.526, 0.627, 0.717, 0.795, 0.86, 0.912, 0.953, 0.985, 1.007, 1.022, 1.032, 1.037, 1.038, 1.037, 1.035, 1.031, 1.027, 1.023, 1.018, 1.015, 1.011, 1.008, 1.006, 1.003, 1.002, 1.001, 1);
    --smooth:linear(0, 0.03, 0.1, 0.191, 0.289, 0.385, 0.475, 0.557, 0.629, 0.692, 0.745, 0.791, 0.829, 0.861, 0.887, 0.908, 0.926, 0.941, 0.952, 0.962, 0.969, 0.976, 0.981, 0.985, 0.988, 0.99, 0.992, 0.994, 0.995, 0.996, 1);
  }
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
html{background:var(--paper); -webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px; line-height:1.4; letter-spacing:-.01em; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased; word-break:keep-all;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
button{font:inherit; color:inherit; letter-spacing:inherit; background:none; border:0; cursor:pointer; text-align:inherit}
input,textarea{font:inherit; color:inherit; letter-spacing:inherit; user-select:text; -webkit-user-select:text; caret-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink3); opacity:1}
input::-webkit-calendar-picker-indicator{display:none !important}   /* 항목 이름 추천 목록의 기본 화살표 숨김 */
input:focus-visible{outline:none}
svg{display:block}
h2,h3{font:inherit}
button:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:8px}

.page{
  max-width:460px; margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 22px) var(--pad) calc(env(safe-area-inset-bottom,0px) + 44px + var(--kb,0px));
}
.sec + .sec{margin-top:24px; padding-top:20px; border-top:1px solid var(--rule)}

/* ---------- 굴러서 바뀌는 글자 ---------- */
.rc{display:inline-block; position:relative; clip-path:inset(0 -2px)}
.rg{display:inline-block}
.rg.old{position:absolute; left:0; top:0}
.rc.sp{width:.2em}

/* ---------- 요약 ---------- */
.sum-date{font-size:14px; color:var(--ink2); line-height:1.3}
.hero{height:60px; display:flex; align-items:flex-end}
.hero-num{font-size:46px; font-weight:300; line-height:1.14; letter-spacing:-.025em; white-space:nowrap}
.hero-num .u{font-size:.46em; font-weight:400; letter-spacing:0; margin:0 .05em 0 .1em}
.hero-num.none{font-size:34px !important; color:var(--ink3); transition:font-size .45s var(--smooth), color .45s var(--smooth)}
.sum-row{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:34px; margin-top:4px}
.delta{flex:1; min-width:0; font-size:14px; color:var(--ink2); line-height:1.35}
.delta b{font-weight:400; color:var(--ink); margin-right:.4em; white-space:nowrap}
.tri{display:inline-block; font-size:.7em; margin-right:.35em; transform:translateY(-.08em)}

/* 기간 알약: 흰 알약이 '차이' 혼합으로 겹친 곳을 뒤집음 → 지나가는 글자가 알약 가장자리에서 정확히 반전됨 */
.seg{
  position:relative; flex:none; display:grid; grid-template-columns:repeat(3,46px); height:30px;
  isolation:isolate; background:var(--paper); touch-action:none; cursor:pointer;
}
.seg button{position:relative; height:100%; font-size:14px; color:var(--ink2); text-align:center; transition:color .2s}
.seg button::before{content:""; position:absolute; inset:-8px 0}
.seg button.on{color:var(--ink)}
.seg-thumb{
  position:absolute; left:0; top:0; width:46px; height:30px; border-radius:15px; z-index:2;
  background:#fff; mix-blend-mode:difference; pointer-events:none; will-change:transform;
  transition:transform .5s var(--spring);
}

/* ---------- 그래프 ---------- */
#chartArea{margin:14px calc(var(--pad) * -1) 0; overflow:hidden; touch-action:pan-y; cursor:pointer}
#track{display:flex; will-change:transform}
.panel{min-width:0; padding:0 var(--pad)}
.pwrap{position:relative; overflow:hidden}
.chart{width:100%; height:auto}
.chart path,.chart line{vector-effect:non-scaling-stroke; fill:none}
.base{stroke:var(--rule); stroke-width:1}
.seg-l{stroke:var(--ink); stroke-width:1.5; stroke-linecap:round}
.seg-out{fill:none; stroke:var(--ink3); stroke-width:1.5; stroke-linecap:round; opacity:.55}
.seg-l.gap{stroke:var(--ink3); stroke-dasharray:1.5 4.5}   /* 기록이 빈 날을 건너뛴 구간 */
.pt,.end{fill:var(--ink)}
.pnote{position:absolute; inset:0; display:grid; place-items:center; font-size:13px; color:var(--ink3)}
.amt-lbl{
  position:absolute; left:0; top:0; padding:0 3px; background:var(--paper);
  font-size:11px; line-height:1.3; color:var(--ink2); white-space:nowrap; pointer-events:none; will-change:transform;
}
/* 고른 날 표시: 세로선은 바닥에서 자라고 점은 그 자리에서 커짐. 옮길 때는 미끄러져 감 */
.cur-line,.cur-dot{position:absolute; pointer-events:none; transition:transform .34s var(--spring); will-change:transform}
.cur-line{left:-.5px; top:0; bottom:0; width:1px; background:var(--ink3); transform-origin:50% 100%; transform:scaleY(0)}
.cur-dot{left:-5px; top:-5px; width:10px; height:10px; border-radius:50%; background:var(--ink); box-shadow:0 0 0 2.5px var(--paper); transform:scale(0)}
.pwrap.scrub .cur-line,.pwrap.scrub .cur-dot{transition:transform .09s ease-out}
.axis{position:relative; height:12px; margin-top:8px; font-size:11px; line-height:12px; color:var(--ink3)}
.axis span{position:absolute; top:0; transform:translateX(-50%); transition:color .2s}
.axis span.on{color:var(--ink)}
.axis.ends{display:flex; justify-content:space-between}
.axis.ends span{position:static; transform:none}
.pfoot{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:14px; min-height:18px; font-size:13px; line-height:1.35; color:var(--ink2)}
.pfoot b{font-weight:400; color:var(--ink); white-space:nowrap}

/* ---------- 달력 ---------- */
.cal-head{display:flex; align-items:center; justify-content:space-between; height:36px}
.cal-title{display:flex; gap:.32em; font-size:17px; font-weight:600; line-height:1.3}
.cal-tools{display:flex; align-items:center; margin-right:-9px}
.ico-btn{width:36px; height:36px; display:grid; place-items:center; color:var(--ink2); border-radius:50%; transition:transform .3s var(--spring), color .15s}
.ico-btn svg{width:20px; height:20px}
.ico-btn:active{transform:scale(.84); color:var(--ink)}
/* '오늘'은 오늘을 벗어났을 때만 아래에서 올라옴 */
.today-btn{font-size:14px; padding:8px 10px; clip-path:inset(4px 0)}
.today-btn span{display:block; transition:transform .5s var(--spring)}
.today-btn.hide{pointer-events:none}
.today-btn.hide span{transform:translateY(170%); transition:transform .2s cubic-bezier(.5,0,.9,.45)}
.week,.cal-page{display:grid; grid-template-columns:repeat(7,1fr); text-align:center}
.week{margin-top:8px; font-size:12px; line-height:1; color:var(--ink3)}
.week span{padding-bottom:8px}
#calClip{margin:0 calc(var(--pad) * -1); padding:0 var(--pad); overflow:hidden; touch-action:pan-y}
#calPages{position:relative; will-change:transform}
.cal-page{position:relative; isolation:isolate; background:var(--paper)}
.cal-page.peek{position:absolute; top:0; width:100%}
.day{height:54px; display:flex; flex-direction:column; align-items:center; padding-top:2px; gap:2px}
.day .num{position:relative; width:36px; height:36px; display:grid; place-items:center; font-size:16px; line-height:1}
.day .amt{font-size:10px; line-height:1; letter-spacing:-.02em; color:var(--ink2); white-space:nowrap}
.day.we .num{color:var(--ink2)}
.day.today .num{font-weight:600; color:var(--ink)}
.day.today .num::after{content:""; position:absolute; inset:3px; border:1px solid var(--ink); border-radius:50%}   /* 오늘 = 테두리 원 */
.day.sel .num,.day.sel .amt{color:var(--ink)}
/* 선택 표식: 누른 날짜로 미끄러져 가며 지나는 숫자를 뒤집음 */
.mark{
  position:absolute; left:0; top:0; width:36px; height:36px; border-radius:50%; z-index:2;
  background:#fff; mix-blend-mode:difference; pointer-events:none; will-change:transform;
  transform:scale(0); transition:transform .42s var(--spring);
}

/* ---------- 고른 날의 기록 ---------- */
#dayClip{position:relative; margin:0 calc(var(--pad) * -1); overflow:hidden}
#dayClip.reordering{overflow:visible; z-index:6}
.day-pane.leaving{position:absolute; top:0; left:0; right:0}
.day-head{display:flex; align-items:flex-start; justify-content:space-between; padding:0 var(--pad)}
.day-date{font-size:14px; color:var(--ink2); line-height:1.3}
.day-total{font-size:26px; font-weight:300; line-height:1.3; letter-spacing:-.02em; white-space:nowrap; margin-top:2px}
.day-total .u{font-size:.6em; font-weight:400; letter-spacing:0; margin:0 .04em 0 .08em}
.day-total.none{color:var(--ink3)}
.day-main{min-width:0; flex:1}
.day-line{display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px}
.btn.carry{height:30px; padding:0 14px; border-radius:15px; font-size:13px; margin:4px 0 2px auto}
.more{margin:-6px -9px 0 0}
.items{margin-top:14px}
.items:empty{display:none}
.items::before{content:""; display:block; height:1px; margin:0 var(--pad); background:var(--rule)}
.item{position:relative; height:56px; overflow:hidden; touch-action:pan-y}
.item-fg{
  position:relative; height:100%; display:flex; align-items:center; gap:12px; padding:0 var(--pad);
  background:var(--paper); clip-path:inset(0 0 round 0); will-change:transform;
  transition:background-color .2s, color .2s, clip-path .32s var(--smooth);
}
.item-fg::after{content:""; position:absolute; left:var(--pad); right:var(--pad); bottom:0; height:1px; background:var(--rule)}
.item-fg{cursor:pointer}
.nm{flex:0 1 auto; min-width:0; margin-right:auto; align-self:stretch; display:flex; align-items:center; cursor:text}
.nm span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item-val{flex:none; align-self:stretch; min-width:120px; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:4px; cursor:text}
.val{line-height:1.2}
.d{font-size:12px; line-height:1; color:var(--ink2)}
/* 왼쪽으로 밀면 뒤에서 드러나는 삭제 */
.act-del{
  position:absolute; top:0; bottom:0; right:0; left:40%; visibility:hidden;
  display:flex; align-items:center; justify-content:flex-end; background:var(--ink); color:var(--paper);
}
.act-del span{width:76px; text-align:center; font-size:15px; font-weight:500}
.item.swiping .act-del{visibility:visible}
/* 길게 눌러 들어 올린 줄: 잉크로 뒤집힌 알약 */
.item.lifted{z-index:5; overflow:visible}
.item.lifted .item-fg{background:var(--ink); color:var(--paper); clip-path:inset(4px 12px round 16px)}
.item.lifted .item-fg::after{display:none}
.item.lifted .d{color:var(--ink3)}
/* 그 자리에서 고치기: 글자와 같은 모양의 입력칸, 밑줄만 그어짐 */
.inline-in{
  width:9.5em; padding:3px 0; border:0; outline:0; border-radius:0; text-align:right; line-height:1.2;
  -webkit-appearance:none; appearance:none;
  background:linear-gradient(var(--ink),var(--ink)) no-repeat right bottom / 100% 1px;
  animation:underline .34s var(--smooth);
}
.inline-in.nm-in{flex:1; width:auto; min-width:0; text-align:left; background-position:left bottom}
@keyframes underline{from{background-size:0 1px}}
.blank{padding:18px var(--pad) 8px}
.blank p{font-size:14px; line-height:1.5; color:var(--ink2)}

/* 항목 추가 */
.adder{overflow:hidden}
.add-open{display:flex; align-items:center; gap:10px; width:100%; height:56px; color:var(--ink2); transition:color .15s}
.add-open svg{width:18px; height:18px}
.add-open:active{color:var(--ink)}
.add-form{display:none}
.adder.open .add-open{display:none}
.adder.open .add-form{display:block}
.add-fields{display:flex; align-items:center; gap:12px; height:56px; box-shadow:inset 0 -1px 0 var(--rule); transition:box-shadow .2s}
.add-fields:focus-within{box-shadow:inset 0 -1px 0 var(--ink)}
.add-fields input{min-width:0; height:100%; padding:0; border:0; outline:0; border-radius:0; background:none; -webkit-appearance:none; appearance:none}
#newName{flex:1}
#newAmt{flex:0 0 8.5em; text-align:right}
.add-actions{display:flex; justify-content:flex-end; gap:6px; padding:12px 0 4px}

/* 버튼: 알약 모양 하나로 통일 */
.btn{height:44px; padding:0 20px; border-radius:22px; font-size:15px; text-align:center; white-space:nowrap; transition:transform .3s var(--spring), background-color .2s, color .2s}
.btn:active{transform:scale(.96)}
.btn.solid{background:var(--ink); color:var(--paper); font-weight:500}
.btn.solid:disabled{background:var(--wash); color:var(--ink3); cursor:default; transform:none}
.btn.ghost{color:var(--ink2)}
.btn.line{box-shadow:inset 0 0 0 1px var(--rule)}
.btn.wide{width:100%; height:52px; border-radius:26px; font-size:16px}
.txt-btn{font-size:14px; color:var(--ink2); padding:10px; border-radius:10px; transition:color .15s}
.txt-btn:active{color:var(--ink)}
.foot{display:flex; flex-wrap:wrap; gap:0 6px; margin-top:26px; padding-top:12px; border-top:1px solid var(--rule)}
.foot .txt-btn:first-child{margin-left:-10px}

/* ---------- 아래에서 올라오는 판 ---------- */
.sheet-bg{
  position:fixed; inset:0 0 var(--kb,0px) 0; z-index:20;
  display:none; align-items:flex-end; justify-content:center; background:var(--dim);
}
.sheet-bg.show{display:flex}
.sheet{
  position:relative; width:calc(100% - 16px); max-width:444px; max-height:calc(100% - env(safe-area-inset-top,0px) - 28px);
  margin-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  display:flex; flex-direction:column; background:var(--raised); border-radius:32px;
  padding:0 calc(var(--pad) - 4px) 16px; will-change:transform;
}
/* 판이 열리면 뒤 화면이 살짝 작아지며 물러남 */
.page{transition:transform .55s var(--smooth)}
.grab{padding:10px 0 8px; touch-action:none; cursor:grab}
.grab i{display:block; width:36px; height:4px; margin:0 auto; border-radius:2px; background:var(--ink3)}
.sheet h3{font-size:17px; font-weight:600; line-height:1.35; padding:6px 0 2px; touch-action:none}
.sheet .msg{font-size:16px; line-height:1.55; white-space:pre-line; padding:8px 0 2px}
.hint{font-size:13px; line-height:1.5; color:var(--ink2); margin-top:6px}
.hint:empty,.preview:empty{display:none}
.preview{font-size:14px; line-height:1.45; margin-top:12px}
.preview.muted{color:var(--ink2)}
.tr-now{font-size:30px; font-weight:300; letter-spacing:-.02em; line-height:1.25; margin-top:4px}
.tr-now .u{font-size:.6em; font-weight:400; letter-spacing:0; margin:0 .04em 0 .08em}
.tr-sub{font-size:14px; color:var(--ink2); margin-top:2px}
.tr-sub b{font-weight:500; color:var(--ink)}
.tr-chart{position:relative; margin-top:18px}
.tr-plot{position:relative}
.tr-chart svg{display:block; width:100%; height:auto; overflow:visible}
.tr-chart .ln{fill:none; stroke:var(--ink); stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round}
.tr-chart .base{stroke:var(--rule)}
.tr-chart .dot{fill:var(--ink)}
.tr-lbl{position:absolute; font-size:12px; color:var(--ink2); white-space:nowrap; transform:translate(-50%,-100%)}
.tr-ax{display:flex; justify-content:space-between; font-size:12px; color:var(--ink3); margin-top:6px}
.tr-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid var(--rule)}
.tr-stats div{display:flex; flex-direction:column; gap:3px; min-width:0}
.tr-stats span{font-size:12px; color:var(--ink2)}
.tr-stats b{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tr-empty{font-size:14px; color:var(--ink2); padding:28px 0; text-align:center}
.sheet-actions{display:flex; gap:10px; margin-top:20px}
.sheet-actions .btn{flex:1; height:52px; border-radius:26px; font-size:16px}
.opt-list{margin:10px calc((var(--pad) - 4px) * -1) 0; overflow-y:auto; -webkit-overflow-scrolling:touch}
.opt{position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:56px; padding:0 calc(var(--pad) - 4px); transition:background-color .2s}
.opt::after{content:""; position:absolute; left:calc(var(--pad) - 4px); right:calc(var(--pad) - 4px); bottom:0; height:1px; background:var(--rule)}
.opt:last-child::after{display:none}
.opt small{font-size:14px; color:var(--ink2)}
.opt:active{background:var(--wash); transition:none}
textarea{
  display:block; width:100%; height:176px; margin-top:12px; padding:12px 14px; resize:none;
  border:0; outline:0; border-radius:16px; background:var(--wash);
  font-size:16px; line-height:1.45; word-break:break-all; -webkit-appearance:none; appearance:none;
  transition:box-shadow .2s;
}
textarea:focus-visible{outline:none; box-shadow:inset 0 0 0 1px var(--ink)}

/* ---------- 알림 (아래에서 올라왔다 아래로 내려감) ---------- */
#snacks{
  position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 16px + var(--kb,0px) + var(--lift,0px)); z-index:40;
  display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 16px; pointer-events:none;
  transition:bottom .45s var(--smooth);   /* 판이 열리면 그 위로 비켜 올라감 */
}
.snack{
  touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab;
  display:flex; align-items:center; gap:2px; max-width:100%; min-height:46px; padding:0 6px 0 18px; border-radius:23px;
  background:var(--ink); color:var(--paper); font-size:14px; line-height:1.4; pointer-events:auto; will-change:transform;
}
.snack.plain{padding:0 18px}
.snack span{padding:12px 0}
.snack button{flex:none; padding:9px 12px; font-weight:600; border-radius:18px}
.snack button:active{background:rgba(128,128,128,.3)}

@media (hover:hover){
  .txt-btn:hover,.add-open:hover,.ico-btn:hover{color:var(--ink)}
  .opt:hover{background:var(--wash)}
  .day:not(.sel):hover .num{background:var(--wash); border-radius:50%}
  .btn.ghost:hover{color:var(--ink)}
}
@media (max-width:350px){
  :root{--pad:18px}
  .seg{grid-template-columns:repeat(3,40px)}
  .seg-thumb{width:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>

<main class="page">

  <!-- 요약 + 그래프 -->
  <section class="sec">
    <div class="sum-date" id="sumDate"></div>
    <div class="hero"><div class="hero-num" id="heroNum" role="img"></div></div>
    <div class="sum-row">
      <div class="delta" id="sumDelta"></div>

        <button class="ico-btn" id="calNext" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg></button>

      <div class="add-form">

          <input id="newName" list="catList" maxlength="20" placeholder="항목 이름" autocomplete="off" enterkeyhint="next">

    <button class="txt-btn" id="btnReset">모두 지우기</button>

</main>

<!-- 고르기 (백업 기간 · 그날 기록 관리) -->
<div class="sheet-bg" id="optSheet">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="optTitle">

<script>
const KEY = 'asset-tracker-v1';
const PALETTE = ['#9fc3e8','#a6dcc2','#e8d9a0','#c9b8e8','#e8b8c4','#b8c4cc','#e8c3a8','#8fd3d0']; // 저장 형식 호환용
const DAY_MS = 86400000;
const DOW = '일월화수목금토';
const $ = id => document.getElementById(id);
const rootCss = getComputedStyle(document.documentElement);
const SPRING = rootCss.getPropertyValue('--spring').trim() || 'cubic-bezier(.3,1.3,.5,1)';
const SMOOTH = rootCss.getPropertyValue('--smooth').trim() || 'cubic-bezier(.22,1,.36,1)';
const EXIT = 'cubic-bezier(.5,0,.9,.45)'; // 떠날 때: 점점 빨라지며 나감
const SHEET = 'cubic-bezier(.32,.72,0,1)';  // 아이폰의 시트가 오르내릴 때 쓰는 곡선
const padPx = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pad')) || 24;
const ICON_MORE = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>';

/* ---------- 유틸 ---------- */
const p2 = n => String(n).padStart(2,'0');
function ymd(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function parse(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function dayNum(s){ return Math.round(parse(s).getTime() / DAY_MS); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const comma = n => Number(n).toLocaleString('ko-KR');
// 좁은 자리용 짧은 금액: 3136.8만 · 1.23억
function trimNum(v, dp){ return String(Number(v.toFixed(dp))); }
function short(n){
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if(a < 10000) return s + a.toLocaleString('ko-KR');
  if(a >= 1e8) return s + trimNum(a / 1e8, 2) + '억';
  return s + trimNum(a / 1e4, 1) + '만';
}
// 읽는 금액: 3,136만 8,403원 (억·만 단위로 끊어 읽는 방식 그대로)
function unitParts(n){
  const a = Math.abs(Math.round(Number(n) || 0));
  const eok = Math.floor(a / 1e8), man = Math.floor((a % 1e8) / 1e4), rest = a % 1e4;
  const out = [];
  if(eok) out.push([comma(eok), '억']);
  if(man) out.push([comma(man), '만']);
  if(rest || !out.length) out.push([comma(rest), '']);
  return out;
}
function unitText(n){ return (n < 0 ? '-' : '') + unitParts(n).map(([d, u]) => d + u).join(' ') + '원'; }
function unitTokens(n){
  const out = [];
  if(n < 0) out.push({ t: '-', c: '' });
  unitParts(n).forEach(([digits, unit], i) => {
    if(i) out.push({ t: '', c: 'sp' });
    [...digits].forEach(ch => out.push({ t: ch, c: '' }));
    if(unit) out.push({ t: unit, c: 'u' });
  });
  out.push({ t: '원', c: 'u' });
  return out;
}
// "11월 9일 월요일" (올해가 아니면 연도 포함)
function fmtDay(s, withDow = true){
  const d = parse(s);
  const y = d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}년 ` : '';
  return `${y}${d.getMonth()+1}월 ${d.getDate()}일` + (withDow ? ` ${DOW[d.getDay()]}요일` : '');
}
const monthOf = s => { const d = parse(s); return new Date(d.getFullYear(), d.getMonth(), 1); };
const sameMonth = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
const tri = diff => `<span class="tri">${diff > 0 ? '▲' : '▼'}</span>`;

/* ---------- 움직임 도구 ---------- */
let uiReady = false; // 첫 화면은 애니메이션 없이 바로 그림
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const canMove = () => uiReady && !reduceMotion();
// 스프링 곡선(linear())을 모르는 브라우저에서도 끊기지 않도록
function anim(el, frames, opts){
  try{ return el.animate(frames, opts); }
  catch(e){ return el.animate(frames, Object.assign({}, opts, { easing: 'ease-out' })); }
}
// 햅틱: 안드로이드는 진동, 아이폰(iOS 18 이상 Safari)은 스위치 토글 방식
function haptic(){
  try{
    const a = document.activeElement;
    if(a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return; // 입력 중에는 키보드가 닫히지 않도록 생략
    if(typeof navigator.vibrate === 'function'){ navigator.vibrate(8); return; }
    const lb = document.createElement('label');
    lb.className = 'hap'; lb.setAttribute('aria-hidden', 'true'); lb.style.display = 'none';
    const ip = document.createElement('input');
    ip.type = 'checkbox'; ip.setAttribute('switch', '');
    lb.appendChild(ip);
    document.head.appendChild(lb);
    lb.click();
    lb.remove();
  }catch(e){}
}
// 글자를 한 칸씩 굴려서 바꿈. dir: 1 = 늘어남(아래에서 올라옴), -1 = 줄어듦(위에서 내려옴), 0 = 바로 바꿈
// 바뀐 칸만 움직이고, 오른쪽 칸부터 차례로 시작
function rollTo(el, tokens, dir){
  const prev = el._tok;
  el._tok = tokens;
  const moving = !!(prev && dir && canMove());
  const shift = prev ? prev.length - tokens.length : 0; // 오른쪽 끝 기준으로 짝지음
  const frag = document.createDocumentFragment();
  const jobs = [];
  tokens.forEach((k, i) => {
    const cell = document.createElement('span');
    cell.className = 'rc' + (k.c ? ' ' + k.c : '');
    const g = document.createElement('span');
    g.className = 'rg';
    g.textContent = k.t;
    cell.appendChild(g);
    frag.appendChild(cell);
    if(!moving) return;
    const p = prev[i + shift];
    if(p && p.t === k.t && p.c === k.c) return;
    let old = null;
    if(p && p.t && p.c === k.c){
      old = document.createElement('span');
      old.className = 'rg old';
      old.textContent = p.t;
      cell.appendChild(old);
    }
    jobs.push({ g, old, delay: (tokens.length - 1 - i) * 26 });
  });
  el.replaceChildren(frag);
  jobs.forEach(j => {
    const opt = { duration: 560, delay: j.delay, easing: SMOOTH, fill: 'both' };
    anim(j.g, [{ transform: `translateY(${dir * 106}%)` }, { transform: 'translateY(0)' }], opt);
    if(j.old) anim(j.old, [{ transform: 'translateY(0)' }, { transform: `translateY(${-dir * 106}%)` }], opt).onfinish = () => j.old.remove();
  });
}
const plainTokens = text => [...text].map(t => ({ t, c: '' }));
function setAmount(el, n, quiet){
  if(el._val === n && el._tok && el.firstChild) return; // 이미 같은 금액이 그려져 있으면 그대로 둠
  const prev = el._val;
  const wasNone = el.classList.contains('none');
  el._val = n;
  el.classList.remove('none');
  el.setAttribute('aria-label', unitText(n));
  rollTo(el, unitTokens(n), quiet ? 0 : prev == null ? (wasNone && el._tok ? 1 : 0) : (n > prev ? 1 : -1));
}
function setPlain(el, text, roll){
  const had = el._val != null && el._tok && el.firstChild;
  el._val = null;
  el.classList.add('none');
  el.setAttribute('aria-label', text);
  if(roll && had){ // 금액에서 '기록 없음'으로: 글자가 굴러 내려가며 바뀜
    rollTo(el, plainTokens(text.replace(/ /g, '\u00a0')), -1);
  }else{ el._tok = null; el.textContent = text; }
}

/* ---------- 알림 ---------- */
// 아래에서 올라오고, 닫힐 때는 아래로 내려감. opt.action = { label, fn } 이면 되돌리기 같은 버튼이 붙음
function snack(msg, opt = {}){
  const box = $('snacks');
  if(!opt.action) box.querySelectorAll('.snack.plain').forEach(closeSnack); // 안내 문구는 하나만
  const el = document.createElement('div');
  el.className = 'snack' + (opt.action ? '' : ' plain');
  el.setAttribute('role', 'status');
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if(opt.action){
    const b = document.createElement('button');
    b.textContent = opt.action.label;
    b.onclick = () => { closeSnack(el); haptic(); opt.action.fn(); };
    el.appendChild(b);
  }
  box.appendChild(el);
  if(!reduceMotion()){
    const h = el.offsetHeight;
    anim(el, [{ transform: `translateY(${h + 70}px)`, marginBottom: `${-(h + 8)}px` }, { transform: 'translateY(0)', marginBottom: '0px' }],
      { duration: 520, easing: SPRING });
  }
  el._ms = opt.ms || (opt.action ? 5000 : 2200);
  el._t = setTimeout(() => closeSnack(el), el._ms);
  snackDrag(el);
  return el;
}
// 잡고 아래로 내리거나 좌우로 밀면 그 방향으로 빠져나가며 닫힘. 조금만 움직였으면 제자리로 돌아옴
function snackDrag(el){
  let d = null;
  el.addEventListener('pointerdown', e => {
    if(el._closing || e.button > 0) return;
    d = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, lt: e.timeStamp, vx: 0, vy: 0, axis: null };
    clearTimeout(el._t);
  });
  el.addEventListener('pointermove', e => {
    if(!d || d.id !== e.pointerId) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    const dt = e.timeStamp - d.lt;
    if(dt > 0){ d.vx = (e.clientX - d.lx) / dt; d.vy = (e.clientY - d.ly) / dt; }
    d.lx = e.clientX; d.ly = e.clientY; d.lt = e.timeStamp;
    if(!d.axis){
      if(Math.hypot(dx, dy) < 6) return;
      d.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      el._moved = true;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      el.getAnimations().forEach(a => a.cancel());
    }
    const t = d.axis === 'x' ? `translateX(${dx}px)` : `translateY(${dy > 0 ? dy : -Math.pow(-dy, .5)}px)`; // 위로는 조금만
    el.style.transition = 'none';
    el.style.transform = t;
    d.dx = dx; d.dy = dy;
  });
  const end = e => {
    if(!d || d.id !== e.pointerId) return;
    const g = d; d = null;
    if(e.timeStamp - g.lt > 90){ g.vx = 0; g.vy = 0; } // 멈췄다가 놓으면 튕긴 것으로 보지 않음
    setTimeout(() => { el._moved = false; }, 0);
    if(!g.axis){ el._t = setTimeout(() => closeSnack(el), el._ms); return; }
    if(g.axis === 'x' && (Math.abs(g.dx) > el.offsetWidth * .3 || (Math.abs(g.vx) > .4 && g.vx * g.dx > 0))){
      closeSnack(el, g.dx > 0 ? 1 : -1); haptic(); return;
    }
    if(g.axis === 'y' && (g.dy > 22 || (g.vy > .35 && g.dy > 4))){ closeSnack(el); haptic(); return; }
    el.style.transition = `transform .45s ${SPRING}`;
    el.style.transform = '';
    el._t = setTimeout(() => closeSnack(el), el._ms);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('click', e => { if(el._moved){ e.stopPropagation(); e.preventDefault(); } }, true); // 밀다가 버튼이 눌리지 않도록
}
// side: 1·-1 = 그 방향 옆으로 빠져나감, 없으면 아래로 내려감. 지금 끌려 있던 자리에서 이어서 움직임
function closeSnack(el, side){
  if(el._closing) return;
  el._closing = true;
  clearTimeout(el._t);
  if(reduceMotion()){ el.remove(); return; }
  const h = el.offsetHeight;
  const from = getComputedStyle(el).transform;
  el.style.transition = 'none';
  const to = side ? `translateX(${side * (innerWidth + 40)}px)` : `translateY(${h + 70}px)`;
  anim(el, [{ transform: from === 'none' ? 'none' : from, marginBottom: '0px' }, { transform: to, marginBottom: `${-(h + 8)}px` }],
    { duration: side ? 340 : 300, easing: side ? SHEET : EXIT, fill: 'forwards' }).onfinish = () => el.remove();
}

/* ---------- 아래에서 올라오는 판 ---------- */
// 열린 판이 있으면 알림이 그 위에 뜨도록 높이를 알려 줌 (판의 버튼을 가리지 않게)
function liftSnacks(){
  let h = 0, open = false;
  document.querySelectorAll('.sheet-bg.show').forEach(bg => { if(!bg._closing){ open = true; h = Math.max(h, bg.firstElementChild.offsetHeight); } });
  document.documentElement.style.setProperty('--lift', h + 'px');
  // 뒤 화면: 지금 보이는 곳의 가운데를 기준으로 살짝 작아짐
  const page = document.querySelector('.page');
  if(open && !reduceMotion()){
    if(!page.style.transform) page.style.transformOrigin = `50% ${scrollY + innerHeight / 2 - page.offsetTop}px`;
    page.style.transform = 'scale(.94)';
  } else page.style.transform = '';
}
function openSheet(id){
  const bg = $(id), panel = bg.firstElementChild;
  bg.getAnimations({ subtree: true }).forEach(a => a.cancel());
  bg._closing = false;
  panel.style.transition = ''; panel.style.transform = '';
  bg.classList.add('show');
  liftSnacks();
  if(reduceMotion()) return;
  const dim = getComputedStyle(bg).backgroundColor;
  anim(bg, [{ backgroundColor: 'rgba(0,0,0,0)' }, { backgroundColor: dim }], { duration: 320, easing: 'ease-out' });
  anim(panel, [{ transform: 'translateY(calc(100% + 28px))' }, { transform: 'translateY(0)' }], { duration: 560, easing: SHEET });
}
// 닫힐 때 판은 흐려지지 않고 그대로 내려감. 뒤의 어두운 배경만 함께 걷힘
function closeSheet(id){
  const bg = $(id), panel = bg.firstElementChild;
  if(!bg.classList.contains('show') || bg._closing) return;
  const a = document.activeElement;
  if(a && bg.contains(a)) a.blur();
  const done = () => {
    bg.classList.remove('show'); bg._closing = false;
    panel.style.transition = ''; panel.style.transform = '';
    bg.getAnimations({ subtree: true }).forEach(x => x.cancel());
    liftSnacks();
  };
  if(reduceMotion()){ done(); return; }
  bg._closing = true;
  liftSnacks();
  const from = getComputedStyle(panel).transform, dim = getComputedStyle(bg).backgroundColor;
  // 닫힐 때도 열릴 때와 같은 스프링: 빠르게 출발해 부드럽게 빠져나감
  anim(bg, [{ backgroundColor: dim }, { backgroundColor: 'rgba(0,0,0,0)' }], { duration: 380, easing: 'ease-out', fill: 'forwards' });
  anim(panel, [{ transform: from === 'none' ? 'translateY(0)' : from }, { transform: 'translateY(calc(100% + 28px))' }],
    { duration: 460, easing: SHEET, fill: 'forwards' }).onfinish = done;
}
// 손잡이·제목을 잡고 아래로 끌면 닫힘 (빠르게 튕겨도 닫힘). 바깥을 눌러도 닫힘
function sheetDrag(id, dismiss){
  const bg = $(id), panel = bg.firstElementChild;
  let d = null;
  panel.addEventListener('pointerdown', e => {
    if(!e.target.closest('.grab, h3') || bg._closing) return;
    d = { id: e.pointerId, y: e.clientY, ly: e.clientY, lt: e.timeStamp, v: 0, dy: 0 };
    try{ panel.setPointerCapture(e.pointerId); }catch(err){}
  });
  panel.addEventListener('pointermove', e => {
    if(!d || d.id !== e.pointerId) return;
    let dy = e.clientY - d.y;
    const dt = e.timeStamp - d.lt;
    if(dt > 0) d.v = (e.clientY - d.ly) / dt;
    d.ly = e.clientY; d.lt = e.timeStamp;
    if(dy < 0) dy = -Math.pow(-dy, .6); // 위로는 고무줄처럼 조금만
    d.dy = dy;
    panel.style.transition = 'none';
    panel.style.transform = `translateY(${dy}px)`;
  });
  const end = e => {
    if(!d || d.id !== e.pointerId) return;
    const { dy, v } = d; d = null;
    if(dy > panel.offsetHeight * .28 || (v > .5 && dy > 12)) dismiss();
    else { panel.style.transition = `transform .5s ${SPRING}`; panel.style.transform = ''; }
  };
  panel.addEventListener('pointerup', end);
  panel.addEventListener('pointercancel', end);
  bg.addEventListener('click', e => { if(e.target === bg) dismiss(); });
}
// 확인: 되돌릴 수 없는 일에만 씀
let askCancel = null;
function ask(msg, okLabel = '확인'){
  return new Promise(resolve => {
    $('confirmMsg').textContent = msg;
    $('confirmOk').textContent = okLabel;
    let settled = false;
    const done = v => { if(settled) return; settled = true; askCancel = null; closeSheet('confirmSheet'); resolve(v); };
    $('confirmOk').onclick = () => done(true);
    $('confirmNo').onclick = () => done(false);
    askCancel = () => done(false);
    openSheet('confirmSheet');
  });
}
// 고르기: 고른 순간 onPick(value)가 바로 실행됨 (복사처럼 누른 그 순간에만 허용되는 동작을 위해)
function pickOption({ title, hint = '', options, onPick }){
  $('optTitle').textContent = title;
  $('optHint').textContent = hint;
  const list = $('optList');
  list.innerHTML = options.map((o, i) =>
    `<button class="opt" data-i="${i}"><span>${esc(o.label)}</span>${o.detail ? `<small>${esc(o.detail)}</small>` : ''}</button>`).join('');
  list.onclick = e => {
    const b = e.target.closest('.opt'); if(!b) return;
    closeSheet('optSheet');
    onPick(options[+b.dataset.i].value);

/* ---------- 항목 하나의 최근 추이 ---------- */
// 그 항목이 처음 기록된 날부터 고른 날까지 전부를 작은 선 그래프로 보여 줌
function openTrend(cid){
  const c = state.categories.find(x => x.id === cid);
  if(!c) return;
  const upto = view.selected;
  const ds = sortedDates().filter(d => d <= upto && state.snapshots[d][cid] !== undefined);
  const pts = ds.map(d => ({ d, v: Number(state.snapshots[d][cid]) }));
  $('trendTitle').textContent = c.name;
  const cur = pts.length ? pts[pts.length - 1] : null;
  $('trendNow').innerHTML = cur ? unitTokens(cur.v).map(k => k.c === 'u' ? `<span class="u">${k.t}</span>` : k.c === 'sp' ? ' ' : k.t).join('') : '';
  const chart = $('trendChart'), stats = $('trendStats');
  if(pts.length < 2){
    $('trendSub').textContent = cur ? `${fmtDay(cur.d, false)} 기록` : '';
    chart.innerHTML = '<p class="tr-empty">기록이 두 번 이상 쌓이면 추이가 그려져요</p>';
    stats.innerHTML = '';
    openSheet('trendSheet');
    return;
  }
  const first = pts[0], diff = cur.v - first.v;
  $('trendSub').innerHTML = `처음 기록한 ${fmtDay(first.d, false)}부터 <b>${diff === 0 ? '변화 없음' : tri(diff) + unitText(Math.abs(diff))}</b>`;
  const W = 400, H = 130, PT = 22, PB = 8, PX = 6;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if(lo === hi){ lo -= 1; hi += 1; }
  const t0 = dayNum(first.d), span = Math.max(dayNum(cur.d) - t0, 1);
  const X = d => PX + (dayNum(d) - t0) / span * (W - PX * 2);
  const Y = v => PT + (hi - v) / (hi - lo) * (H - PT - PB);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const lbl = (p, cls) => `<span class="tr-lbl ${cls}" style="left:${(X(p.d) / W * 100).toFixed(2)}%; top:${((Y(p.v) - 7) / H * 100).toFixed(2)}%">${short(p.v)}</span>`;
  chart.innerHTML = `<div class="tr-plot"><svg viewBox="0 0 ${W} ${H}"><line class="base" x1="0" y1="${H - .5}" x2="${W}" y2="${H - .5}"/>
      <path class="ln" d="${path}"/><circle class="dot" r="3.5" cx="${X(cur.d).toFixed(1)}" cy="${Y(cur.v).toFixed(1)}"/></svg>
    ${lbl(first, 'a')}${lbl(cur, 'b')}</div>
    <div class="tr-ax"><span>${fmtDay(first.d, false)}</span><span>${fmtDay(cur.d, false)}</span></div>`;
  // 양끝 금액이 가장자리 밖으로 나가지 않도록
  chart.querySelector('.tr-lbl.a').style.transform = 'translate(0,-100%)';
  chart.querySelector('.tr-lbl.b').style.transform = 'translate(-100%,-100%)';
  const hiP = pts.reduce((a, b) => b.v > a.v ? b : a), loP = pts.reduce((a, b) => b.v < a.v ? b : a);
  stats.innerHTML = `<div><span>최고</span><b>${short(hiP.v)}</b></div><div><span>최저</span><b>${short(loP.v)}</b></div>
    <div><span>직전 대비</span><b>${(() => { const k = pts[pts.length - 1].v - pts[pts.length - 2].v; return k === 0 ? '변화 없음' : tri(k) + short(Math.abs(k)); })()}</b></div>`;
  openSheet('trendSheet');
}

/* ---------- 저장 ---------- */
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.categories) && s.snapshots && typeof s.snapshots === 'object') return s;
  }catch(e){}
  return { categories: [], snapshots: {} };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch(e){ snack('저장하지 못했어요. 저장 공간이 부족할 수 있어요', { ms: 3500 }); return false; }
}
// 같은 이름의 항목을 하나로 묶음. 같은 날짜에 겹치는 금액은 합산.
function consolidate(){
  const firstId = {};
  const remap = {};
  const cats = [];
  state.categories.forEach(c => {
    const name = String(c.name).trim();
    if(firstId[name]){ remap[c.id] = firstId[name]; return; }
    firstId[name] = c.id;
    remap[c.id] = c.id;
    cats.push({ ...c, name });
  });
  if(cats.length === state.categories.length) return false;
  Object.keys(state.snapshots).forEach(d => {
    const nw = {};
    Object.keys(state.snapshots[d]).forEach(cid => {
      const nid = remap[cid] || cid;
      nw[nid] = (nw[nid] || 0) + Number(state.snapshots[d][cid] || 0);
    });
    state.snapshots[d] = nw;
  });
  state.categories = cats;
  return true;
}

/* ---------- 계산 ---------- */
function sortedDates(){ return Object.keys(state.snapshots).sort(); }
function latestDate(){
  const all = sortedDates();
  return all.length ? all[all.length-1] : null;
}
function totalOf(date){
  const snap = state.snapshots[date] || {};
  return state.categories.reduce((s,c) => s + (Number(snap[c.id]) || 0), 0);
}
function prevRecordDate(date){
  const ds = sortedDates().filter(d => d < date);
  return ds.length ? ds[ds.length-1] : null;
}
// 항목별 증감: 직전 기록일의 같은 항목과 비교
function itemDelta(catId, date){
  const cur = state.snapshots[date]?.[catId];
  if(cur === undefined) return null;
  const pk = prevRecordDate(date);
  const prev = pk ? state.snapshots[pk][catId] : undefined;
  if(prev === undefined) return { type:'new' };
  const diff = Number(cur) - Number(prev);
  return diff === 0 ? { type:'same' } : { type: diff > 0 ? 'up' : 'down', diff };
}
function activeAnchor(){ return view.anchor || latestDate() || ymd(new Date()); }
// 보이는 기간: 주는 일~토, 월은 1일~말일, 전체는 첫 기록~마지막 기록
function windowFor(anchor){
  if(view.range === 'all'){
    const all = sortedDates();
    return all.length ? { start: all[0], end: all[all.length-1] } : null;
  }
  const d = parse(anchor);
  if(view.range === '1w'){
    const s = new Date(d);
    s.setDate(d.getDate() - d.getDay());
    return { start: ymd(s), end: addDays(ymd(s), 6) };
  }
  const s = new Date(d.getFullYear(), d.getMonth(), 1);
  const e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { start: ymd(s), end: ymd(e) };
}
function periodLabel(w){
  const yr = d => d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}년 ` : '';
  if(view.range === '1w'){
    // 목요일이 속한 달로 주를 가져감 (달을 넘기는 주는 목요일 쪽 달에 속함)
    const last = parse(addDays(w.start, 4));
    const n = Math.ceil((last.getDate() + new Date(last.getFullYear(), last.getMonth(), 1).getDay()) / 7);
    return `${yr(last)}${last.getMonth()+1}월 ${n}주차`;
  }
  const mid = parse(addDays(w.start, 3));
  return `${yr(mid)}${mid.getMonth()+1}월`;
}
function shiftAnchor(anchor, dir){
  const a = parse(anchor);
  if(view.range === '1w') a.setDate(a.getDate() + 7 * dir);
  else { a.setDate(1); a.setMonth(a.getMonth() + dir); }
  return ymd(a);
}
// 기록이 있는 기간까지만 넘길 수 있음 (그 너머는 고무줄처럼 버팀)
function canShift(dir){
  if(view.range === 'all') return false;
  const all = sortedDates();
  if(!all.length) return false;
  const w = windowFor(shiftAnchor(activeAnchor(), dir));
  return dir < 0 ? w.end >= all[0] : w.start <= all[all.length - 1];
}
// 위 큰 숫자가 가리키는 날: 그래프에서 고른 날, 없으면 보이는 기간의 마지막 기록
function readoutDate(){
  if(view.point && state.snapshots[view.point]) return view.point;
  if(view.unpicked) return null; // 점을 눌러 선택을 푼 상태
  const all = sortedDates();
  if(!all.length) return null;
  const w = windowFor(activeAnchor());
  if(!w) return all[all.length - 1];
  let best = null;
  for(const d of all){ if(d <= w.end) best = d; else break; }
  return best || all[0];
}
// 보이는 기간 동안의 변화: 기간 직전 기록(없으면 기간 첫 기록) → 기간 마지막 기록
function periodChange(w){
  const ds = sortedDates().filter(d => d >= w.start && d <= w.end);
  if(!ds.length) return null;
  const before = view.range === 'all' ? null : prevRecordDate(w.start);
  const base = before ? totalOf(before) : totalOf(ds[0]);
  return totalOf(ds[ds.length - 1]) - base;
}

// 보기 좋은 눈금 간격 (1·2·5 × 10^n)
function niceStep(range){
  const raw = range / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}
// 주·월 보기: 모든 주(달)가 같은 y 간격(높이)을 쓰고, 위치(offset)만 달라짐
function periodKeyOf(d){
  if(view.range === '1w'){ const x = parse(d); x.setDate(x.getDate() - x.getDay()); return ymd(x); }
  return d.slice(0, 7);
}
function rangeSpan(){
  const groups = {};
  sortedDates().forEach(d => { const k = periodKeyOf(d); (groups[k] = groups[k] || []).push(totalOf(d)); });
  const vals = Object.values(groups);
  let S = 0;
  vals.forEach(v => { S = Math.max(S, Math.max(...v) - Math.min(...v)); });
  if(!S) S = Math.max(1, ...vals.flat()) * 0.06; // 모든 기록 값이 같을 때
  return S + 2 * (S * 0.1 + niceStep(S)); // 위아래 여백: 10% + 눈금 한 칸
}
function yRangeOf(anchor){
  const w = windowFor(anchor);
  if(!w) return null;
  const vals = sortedDates().filter(d => d >= w.start && d <= w.end).map(d => totalOf(d));
  if(!vals.length) return null;
  if(view.range !== 'all'){
    const R = rangeSpan();
    const c = (Math.min(...vals) + Math.max(...vals)) / 2;
    const min = Math.max(0, c - R / 2);
    return { min, max: min + R };
  }
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min === max){ min = max * 0.97; max = (max * 1.03) || 1; }
  const pad = (max - min) * 0.1; // 최저/최고점이 가장자리에 붙지 않도록 약간 여백
  return { min: Math.max(0, min - pad), max: max + pad };
}
// 높이 기준을 from → to 로 부드럽게 바꿈 (새 전환이 시작되면 이전 것은 멈춤)
let tweenToken = 0;
function tweenRange(from, to, dur, draw){
  const token = ++tweenToken;
  if(!to) return;
  if(!from || reduceMotion()){ draw(to); return; }
  const start = performance.now();
  const step = now => {
    if(token !== tweenToken) return;
    const t = Math.min(1, (now - start) / dur);
    const k = 1 - Math.pow(1 - t, 3);
    draw({ min: from.min + (to.min - from.min) * k, max: from.max + (to.max - from.max) * k });
    if(t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  }
  $('sumDate').textContent = fmtDay(date);

  del.innerHTML = diff === 0 ? `<b>변화 없음</b>${label}` : `<b>${tri(diff)}${unitText(Math.abs(diff))}</b>${label}`;
}
// 금액이 길어 화면을 넘치면 글자 크기를 줄여 한 줄에 맞춤
function fitHero(){
  const el = $('heroNum');
  if(el.classList.contains('none')){ el.style.fontSize = ''; return; }
  const max = el.parentNode.clientWidth;
  let s = 46;
  el.style.fontSize = s + 'px';
  while(s > 26 && el.getBoundingClientRect().width > max){ s -= 2; el.style.fontSize = s + 'px'; }
}

/* ---------- 그래프 ---------- */
const chartArea = $('chartArea'), track = $('track');
const CW = 400, CH = 160, CPX = 8, CPT = 24, CPB = 22;
let chartPts = [];
let chartScaleCache = null;
function chartScale(){
  if(chartScaleCache === null) chartScaleCache = (chartArea.clientWidth - padPx() * 2) / CW;
  return chartScaleCache;
}
// 날짜 → 가로 위치. 주 보기는 일곱 칸의 가운데에 찍어서 아래 달력의 요일 칸과 세로로 맞춤
function xScale(w){
  const t0 = dayNum(w.start);
  if(view.range === '1w') return d => (dayNum(d) - t0 + .5) / 7 * CW;
  const span = Math.max(dayNum(w.end) - t0, 1);
  return d => CPX + (dayNum(d) - t0) / span * (CW - CPX * 2);
}
// 가로 눈금: 주는 일곱 날짜, 월은 7일 간격, 전체는 처음과 끝 날짜
function axisHTML(w){
  if(!w) return '<div class="axis"></div>';
  if(view.range === 'all') return `<div class="axis ends"><span>${w.start.replace(/-/g, '.')}</span><span>${w.end.replace(/-/g, '.')}</span></div>`;
  const X = xScale(w), days = [];
  const n = dayNum(w.end) - dayNum(w.start);
  for(let i = 0; i <= n; i += view.range === '1w' ? 1 : 7) days.push(addDays(w.start, i));
  return `<div class="axis">${days.map(d => `<span data-d="${d}" style="left:${(X(d) / CW * 100).toFixed(2)}%">${+d.slice(8)}</span>`).join('')}</div>`;
}
// 위 큰 숫자가 가리키는 날의 눈금을 진하게
function markAxis(){
  const date = readoutDate();
  track.querySelectorAll('.axis span.on').forEach(el => el.classList.remove('on'));
  const el = date && centerPanel() && centerPanel().querySelector(`.axis span[data-d="${date}"]`);
  if(el) el.classList.add('on');
}
// 기록된 날짜만 점으로 표시 (기록 없는 날은 건너뜀). yr을 주면 그 높이 기준으로 계산
function chartGeom(anchor, yr){
  const w = windowFor(anchor);
  if(!w) return null;
  const pts = sortedDates().filter(d => d >= w.start && d <= w.end).map(d => ({ d, v: totalOf(d) }));
  if(!pts.length) return null;
  const R = yr || yRangeOf(anchor);
  const X = xScale(w);
  const Y = v => CPT + (R.max - v) / (R.max - R.min) * (CH - CPT - CPB);
  // 보이는 기간 바로 앞·뒤의 기록 (양끝에서 기간 밖으로 이어지는 희미한 선용)
  const all = sortedDates();
  const out = view.range === 'all' ? [] : [all.filter(d => d < w.start).pop(), all.find(d => d > w.end)]
    .map(d => d ? { x: X(d), y: Y(totalOf(d)), d } : null);
  return { w, out, P: pts.map(p => ({ x: X(p.d), y: Y(p.v), d: p.d, v: p.v })) };
}
function panelAnchors(){
  const c = activeAnchor();
  return view.range === 'all' ? [c] : [shiftAnchor(c, -1), c, shiftAnchor(c, 1)];
}
const centerPanel = () => track.children[+track.dataset.c];
// 패널의 뼈대 (위치는 layoutPanel이 채움 → 넘기는 동안 높이 기준이 바뀌어도 뼈대는 그대로)
function panelHTML(anchor){
  const w = windowFor(anchor);
  const g = chartGeom(anchor);
  const name = view.range === 'all' ? '전체 기간' : periodLabel(w);
  const base = `<line class="base" x1="0" y1="${CH - .5}" x2="${CW}" y2="${CH - .5}"/>`;
  const axis = axisHTML(w);
  if(!g){
    const note = sortedDates().length ? '이 기간에는 기록이 없어요' : '기록을 남기면 변화가 여기에 그려져요';
    return `<div class="pwrap"><svg class="chart" viewBox="0 0 ${CW} ${CH}">${base}</svg><p class="pnote">${note}</p></div>
      ${axis}<div class="pfoot"><span>${name}</span></div>`;
  }
  const P = g.P;
  const segs = P.slice(0, -1).map((p, i) => `<path class="seg-l${dayNum(P[i+1].d) - dayNum(p.d) === 1 ? '' : ' gap'}"/>`).join('');
  const dots = P.length > 1 && P.length <= 31 ? P.map(() => '<circle class="pt" r="2"/>').join('') : '';
  const ch = periodChange(w);
  const chTxt = ch === null ? '' : ch === 0 ? '변화 없음' : tri(ch) + unitText(Math.abs(ch));
  return `<div class="pwrap">
      <svg class="chart" viewBox="0 0 ${CW} ${CH}">${base}<path class="seg-out" data-k="a"/><path class="seg-out" data-k="b"/><g>${segs}</g><g>${dots}</g><circle class="end" r="3.5"/></svg>
      <span class="amt-lbl" data-k="hi"></span><span class="amt-lbl" data-k="lo"></span>
      <i class="cur-line"></i><i class="cur-dot"></i>
    </div>
    ${axis}<div class="pfoot"><span>${name}</span><b>${chTxt}</b></div>`;
}
function layoutPanel(panel, anchor, yr, isCenter){
  const g = chartGeom(anchor, yr);
  if(isCenter) chartPts = g ? g.P : [];
  if(!g || !panel || !panel.querySelector('.end')) return;
  const P = g.P, f = v => v.toFixed(1), s = chartScale();
  panel.querySelectorAll('.seg-l').forEach((el, i) => {
    if(P[i + 1]) el.setAttribute('d', `M${f(P[i].x)},${f(P[i].y)} L${f(P[i+1].x)},${f(P[i+1].y)}`);
  });
  panel.querySelectorAll('.pt').forEach((el, i) => {
    if(P[i]){ el.setAttribute('cx', f(P[i].x)); el.setAttribute('cy', f(P[i].y)); }
  });
  const [oa, ob] = g.out || [];
  panel.querySelectorAll('.seg-out').forEach(el => {
    const o = el.dataset.k === 'a' ? oa : ob, q = el.dataset.k === 'a' ? P[0] : P[P.length - 1];
    if(o) el.setAttribute('d', `M${f(o.x)},${f(o.y)} L${f(q.x)},${f(q.y)}`); else el.removeAttribute('d');
  });
  const end = panel.querySelector('.end'), last = P[P.length - 1];
  end.setAttribute('cx', f(last.x)); end.setAttribute('cy', f(last.y));
  // 가장 옛날 점과 가장 최근 점에 금액 (점이 위쪽 가장자리에 붙으면 아래에 적음)
  const first = P[0];
  const put = (k, p, flip) => {
    const el = panel.querySelector(`.amt-lbl[data-k="${k}"]`);
    if(!p){ el.style.display = 'none'; return; }
    el.style.display = '';
    el.textContent = short(p.v);
    const above = flip ? !(last.y > 34) : p.y > 34;
    const left = p.x < 56, right = p.x > CW - 56;
    const px = left ? 0 : right ? CW : p.x;
    el.style.transform = `translate(${f(px * s)}px, ${f((p.y + (above ? -13 : 13)) * s)}px) translate(${left ? '0' : right ? '-100%' : '-50%'}, -50%)`;
  };
  put('hi', P.length > 1 ? first : null, last.x - first.x < 90); // 두 점이 가까우면 서로 반대쪽에 적어 겹치지 않게
  put('lo', last);
  if(isCenter) placeCursor(false);
  else placeStaticCursor(panel, P, s); // 옆 기간에도 고른 날 표시를 미리 둠 → 넘기는 동안 그래프와 함께 움직임
}
function placeStaticCursor(panel, P, s){
  const wrap = panel.querySelector('.pwrap');
  const line = wrap && wrap.querySelector('.cur-line'), dot = wrap && wrap.querySelector('.cur-dot');
  if(!line) return;
  const p = view.point ? P.find(q => q.d === view.point) : null;
  [line, dot].forEach(el => { el.style.transition = 'none'; });
  const x = p ? p.x * s : 0, y = p ? p.y * s : 0, k = p ? 1 : 0;
  line.style.transform = `translateX(${x.toFixed(1)}px) scaleY(${k})`;
  dot.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${k})`;
  void wrap.offsetWidth;
  [line, dot].forEach(el => { el.style.transition = ''; });
}
// 고른 날 표시. animate: 미끄러져 감 / fast: 훑는 중이라 손가락에 바짝 붙음
function placeCursor(animate, fast){
  const panel = centerPanel();
  const wrap = panel && panel.querySelector('.pwrap');
  if(!wrap) return;
  const line = wrap.querySelector('.cur-line'), dot = wrap.querySelector('.cur-dot');
  if(!line) return;
  const p = view.point ? chartPts.find(q => q.d === view.point) : null;
  const s = chartScale();
  wrap.classList.toggle('scrub', !!fast);
  const set = (x, y, k) => {
    line.style.transform = `translateX(${x.toFixed(1)}px) scaleY(${k})`;
    dot.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${k})`;
  };
  const still = on => [line, dot].forEach(el => { el.style.transition = on ? 'none' : ''; });
  if(!p){
    if(wrap._cur){ if(!animate) still(true); set(wrap._cur[0], wrap._cur[1], 0); if(!animate){ void wrap.offsetWidth; still(false); } }
    wrap._cur = null;
    return;
  }
  const x = p.x * s, y = p.y * s;
  if(!wrap._cur || !animate){
    // 처음 나타날 때는 그 자리에서: 점이 커지고 선이 바닥에서 자람
    still(true);
    set(x, y, animate ? 0 : 1);
    void wrap.offsetWidth;
    still(false);
  }
  set(x, y, 1);
  wrap._cur = [x, y];
}
// 전체 보기는 한 장, 주·월은 앞·현재·뒤 기간을 나란히 둠
function renderChart(){
  const anchors = panelAnchors();
  const n = anchors.length, c = n === 1 ? 0 : 1;
  track.dataset.n = n;
  track.dataset.c = c;
  track.style.width = `${n * 100}%`;
  track.style.transition = 'none';
  track.style.transform = `translateX(${-(c * 100 / n)}%)`;
  // 넘길 수 없는 쪽(기록 범위 밖)은 비워 둠
  track.innerHTML = anchors.map((a, i) =>
    `<div class="panel" style="flex:0 0 ${100 / n}%">${n === 3 && i !== c && !canShift(i < c ? -1 : 1) ? '' : panelHTML(a)}</div>`).join('');
  chartPts = [];
  anchors.forEach((a, i) => layoutPanel(track.children[i], a, null, i === c));
  markAxis();
}
// 기간을 바꾸면 선이 왼쪽부터 다시 그려짐
function wipeChart(){
  if(reduceMotion()) return;
  const wrap = centerPanel() && centerPanel().querySelector('.pwrap');
  if(!wrap) return;
  anim(wrap, [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 640, easing: SMOOTH });
}
function nearestPoint(clientX){
  if(!chartPts.length) return null;
  const wrap = centerPanel().querySelector('.pwrap');
  const rect = wrap.getBoundingClientRect();
  const vx = (clientX - rect.left) / rect.width * CW;
  let best = chartPts[0];
  chartPts.forEach(p => { if(Math.abs(p.x - vx) < Math.abs(best.x - vx)) best = p; });
  return best;
}

/* ---------- 달력 ---------- */
const CAL_ROW = 54, MARK = 36;
const calClip = $('calClip'), calPages = $('calPages');
let calCur = null, calPeek = null, calBusy = false, calPending = null, calDrag = null, calSuppressAt = 0;
const monthShift = (m, d) => new Date(m.getFullYear(), m.getMonth() + d, 1);
const calStep = () => calPages.clientWidth + padPx() * 2; // 한 달을 넘길 때 움직이는 거리 = 화면 폭
function buildPage(month){
  const el = document.createElement('div');
  el.className = 'cal-page';
  const y = month.getFullYear(), mo = month.getMonth();
  const first = new Date(y, mo, 1).getDay();
  const days = new Date(y, mo + 1, 0).getDate();
  const todayS = ymd(new Date());
  let html = '';
  for(let i = 0; i < first; i++) html += '<span class="day blank"></span>';
  for(let d = 1; d <= days; d++){
    const key = `${y}-${p2(mo+1)}-${p2(d)}`;
    const dow = (first + d - 1) % 7;
    const cls = 'day' + (dow === 0 || dow === 6 ? ' we' : '') + (key === todayS ? ' today' : '');
    html += `<button class="${cls}" data-date="${key}"><span class="num">${d}</span><span class="amt">${state.snapshots[key] ? short(totalOf(key)) : ''}</span></button>`;
  }
  el.innerHTML = html + '<i class="mark"></i>';
  el._month = month; el._first = first; el._rows = Math.ceil((first + days) / 7);
  placeMark(el, false);
  return el;
}
// 선택 표식을 고른 날짜 칸으로. 같은 달 안에서는 미끄러져 가고, 다른 달이면 그 자리에서 줄어들어 사라짐
function placeMark(page, animate){
  const mk = page.querySelector('.mark');
  const sel = parse(view.selected);
  page.querySelectorAll('.day.sel').forEach(x => x.classList.remove('sel'));
  const move = animate && canMove();
  const still = fn => { mk.style.transition = 'none'; fn(); void mk.offsetWidth; mk.style.transition = ''; };
  if(!sameMonth(sel, page._month)){
    const [x, y] = mk._pos || [0, 0];
    if(move) mk.style.transform = `translate(${x}px, ${y}px) scale(0)`;
    else still(() => { mk.style.transform = `translate(${x}px, ${y}px) scale(0)`; });
    mk._on = false;
    return;
  }
  const idx = page._first + sel.getDate() - 1;
  const cw = calPages.clientWidth / 7;
  const x = +((idx % 7) * cw + cw / 2 - MARK / 2).toFixed(2), y = Math.floor(idx / 7) * CAL_ROW + 2;
  const cell = page.querySelector(`[data-date="${view.selected}"]`);
  if(cell) cell.classList.add('sel');
  if(!move) still(() => { mk.style.transform = `translate(${x}px, ${y}px) scale(1)`; });
  else {
    if(!mk._on) still(() => { mk.style.transform = `translate(${x}px, ${y}px) scale(0)`; }); // 없던 표식은 그 자리에서 커짐
    mk.style.transform = `translate(${x}px, ${y}px) scale(1)`;
  }
  mk._pos = [x, y]; mk._on = true;
}
function setClipH(rows, animate){
  calClip.style.transition = animate && canMove() ? `height .38s ${SMOOTH}` : 'none';
  calClip.style.height = rows * CAL_ROW + 'px';
}
let calTitleKey = null;
function setCalTitle(m){
  const key = m.getFullYear() * 12 + m.getMonth();
  if(key === calTitleKey) return;
  const dir = calTitleKey === null ? 0 : key > calTitleKey ? 1 : -1;
  calTitleKey = key;
  rollTo($('calYear'), plainTokens(`${m.getFullYear()}년`), dir);
  rollTo($('calMonth'), plainTokens(`${m.getMonth() + 1}월`), dir);
}
function syncTodayBtn(){
  const now = new Date();
  const away = view.selected !== ymd(now) || !sameMonth(view.month, now);
  const b = $('todayBtn');
  b.classList.toggle('hide', !away);
  b.tabIndex = away ? 0 : -1;
}
function renderCalendar(){
  const page = buildPage(view.month);
  calPages.replaceChildren(page);
  calCur = page; calPeek = null;
  setClipH(page._rows, false);
  setCalTitle(view.month);
  syncTodayBtn();
}
function refreshCalAmounts(){
  calPages.querySelectorAll('.day[data-date]').forEach(b => {
    const k = b.dataset.date;
    b.querySelector('.amt').textContent = state.snapshots[k] ? short(totalOf(k)) : '';
  });
}
// 옆 달을 미리 그려서 붙여 둠 (손가락을 따라 함께 들어옴)
function ensurePeek(dir, month){
  const m = month || monthShift(view.month, dir);
  const key = dir + '|' + m.getFullYear() + '-' + m.getMonth();
  if(calPeek && calPeek._key === key) return calPeek;
  if(calPeek) calPeek.remove();
  const el = buildPage(m);
  el.classList.add('peek');
  el.style.left = dir * calStep() + 'px';
  el._key = key; el._dir = dir;
  calPages.appendChild(el);
  calPeek = el;
  setClipH(Math.max(calCur._rows, el._rows), true);
  return el;
}
// pass = 넘김 확정. 옆 달이 그대로 새 화면이 됨 (다시 그리지 않으므로 끊김 없음)
function finishCal(pass){
  const peek = calPeek, dir = peek ? peek._dir : 0, go = !!(pass && peek);
  const ms = reduceMotion() ? 0 : 400;
  calBusy = true;
  calPages.style.transition = ms ? `transform ${ms}ms ${SMOOTH}` : 'none';
  calPages.style.transform = go ? `translateX(${-dir * calStep()}px)` : 'translateX(0px)';
  setClipH(go ? peek._rows : calCur._rows, true);
  if(go){ setCalTitle(peek._month); haptic(); }
  setTimeout(() => {
    calPages.style.transition = 'none';
    calPages.style.transform = '';
    if(go){
      view.month = peek._month;
      peek.classList.remove('peek');
      peek.style.left = '';
      calPages.replaceChildren(peek);
      calCur = peek;
    } else if(peek) peek.remove();
    calPeek = null;
    calBusy = false;
    placeMark(calCur, true); // 넘기는 도중에 선택이 바뀌었으면 표식을 맞춤
    syncTodayBtn();
    if(calPending){ const f = calPending; calPending = null; f(); }
  }, ms);
}
// 화살표·오늘·다른 달 날짜 선택: 그 달을 옆에 붙여 같은 방식으로 넘김
function calGo(month){
  if(calBusy){ calPending = () => calGo(month); return; }
  if(sameMonth(month, view.month)) return;
  ensurePeek(month > view.month ? 1 : -1, month);
  calPages.style.transition = 'none';
  calPages.style.transform = 'translateX(0px)';
  void calPages.offsetWidth;
  finishCal(true);
}
function selectDate(date){
  const prev = view.selected;
  const m = monthOf(date);
  if(date === prev){ calGo(m); return; }
  view.selected = date;
  placeMark(calCur, true);
  if(!sameMonth(m, view.month)) calGo(m);
  renderDay(date > prev ? 1 : -1);
  syncTodayBtn();
}
function goToday(){

function buildDayPane(){
  const date = view.selected, snap = state.snapshots[date], has = !!snap;

  // 빈 날: 직전 기록이 있으면 '기록 없음' 왼쪽에 이어받기 버튼을 둠
  const carry = !has && pk ? `<button class="btn solid carry" data-act="carry">${fmtDay(pk, false)} 기록 이어받기</button>` : '';
  const blank = has || pk ? '' : '<div class="blank"><p>항목 이름과 금액을 적으면 그날의 재산으로 기록돼요.</p></div>';

    <div class="items">${rows.map(c => rowHTML(c, date)).join('')}</div>${blank}`;
  pane._date = date; pane._has = has;

// dir: 다른 날로 옮길 때의 방향 (1 = 뒷날 → 새 내용이 오른쪽에서, -1 = 앞날 → 왼쪽에서). 0 = 같은 날을 그 자리에서 고쳐 그림
function renderDay(dir = 0){
  const old = dayClip.querySelector('.day-pane:not(.leaving)');
  const pane = buildDayPane();
  const tot = pane.querySelector('.day-total');
  const total = pane._has ? totalOf(view.selected) : null;
  openRow = null;
  $('catList').innerHTML = state.categories.map(c => `<option value="${esc(c.name)}">`).join('');
  const flash = view.flash;
  view.flash = null;
  const h0 = dayClip.offsetHeight;

  if(dir && old && canMove()){
    // 이전 날은 밀려 나가고 새 날이 들어옴. 높이는 함께 맞춰짐
    dayClip.getAnimations().forEach(a => a.cancel());
    dayClip.querySelectorAll('.day-pane.leaving').forEach(p => p.remove());
    old.getAnimations().forEach(a => a.cancel());
    old.classList.add('leaving');
    dayClip.appendChild(pane);
    if(total === null) setPlain(tot, '기록 없음'); else setAmount(tot, total, true);
    const W = dayClip.clientWidth, h1 = pane.offsetHeight;
    const opt = { duration: 400, easing: SMOOTH };
    anim(old, [{ transform: 'translateX(0)' }, { transform: `translateX(${-dir * W}px)` }], { ...opt, fill: 'forwards' }).onfinish = () => old.remove();
    anim(pane, [{ transform: `translateX(${dir * W}px)` }, { transform: 'translateX(0)' }], opt);
    if(Math.abs(h1 - h0) > 1) anim(dayClip, [{ height: h0 + 'px' }, { height: h1 + 'px' }], opt);
    return;
  }

  const oldTot = old && old._date === pane._date ? old.querySelector('.day-total') : null;
  dayClip.getAnimations().forEach(a => a.cancel());
  dayClip.replaceChildren(pane);
  if(total === null) setPlain(tot, '기록 없음');
  else {
    if(oldTot && oldTot._tok){ tot._tok = oldTot._tok; tot._val = oldTot._val; } // 같은 날이면 합계가 굴러서 바뀜
    setAmount(tot, total);
  }
  if(!canMove()) return;
  const row = flash && flash !== 'all' ? pane.querySelector(`.item[data-row="${flash}"]`) : null;
  if(row){
    // 새로 생긴 줄은 자리를 벌리며 펼쳐짐
    anim(row, [{ height: '0px' }, { height: row.offsetHeight + 'px' }], { duration: 400, easing: SMOOTH });
    return;
  }
  const h1 = dayClip.offsetHeight;
  if(Math.abs(h1 - h0) > 1) anim(dayClip, [{ height: h0 + 'px' }, { height: h1 + 'px' }], { duration: 400, easing: SMOOTH });
}

/* ---------- 항목 / 값 편집 (바로 저장) ---------- */
function applyValue(date, cid, raw){
  const n = parseFloat(String(raw).replace(/,/g, ''));
  if(isNaN(n)){
    if(state.snapshots[date]){
      delete state.snapshots[date][cid];
      if(!Object.keys(state.snapshots[date]).length) delete state.snapshots[date];
    }
  } else {
    state.snapshots[date] = state.snapshots[date] || {};
    state.snapshots[date][cid] = Math.round(n);
  }
}
// 입력 중 숫자만 남기고 천 단위 쉼표를 붙임. 커서는 같은 숫자 뒤에 유지
function fmtAmtInput(inp){
  const raw = inp.value, caret = inp.selectionStart ?? raw.length;
  const digitsBefore = raw.slice(0, caret).replace(/\D/g, '').length;
  const digits = raw.replace(/\D/g, '');
  const out = digits ? Number(digits).toLocaleString('en-US') : '';
  if(out === raw) return;
  let pos = 0, seen = 0;
  while(pos < out.length && seen < digitsBefore){ if(/\d/.test(out[pos])) seen++; pos++; }
  inp.value = out;
  inp.setSelectionRange(pos, pos);
}
// 글자를 같은 모양의 입력칸으로 바꿔 그 자리에서 고침. Enter·바깥 탭 = 저장, Esc = 취소
function inlineEdit(target, { value, cls, numeric, maxLength, onSave }){
  const inp = document.createElement('input');
  inp.className = 'inline-in' + (cls ? ' ' + cls : '');
  if(numeric) inp.inputMode = 'numeric';
  if(maxLength) inp.maxLength = maxLength;
  inp.enterKeyHint = 'done';
  inp.autocomplete = 'off';
  inp.value = value;
  target.replaceWith(inp);
  inp.focus();
  inp.setSelectionRange(inp.value.length, inp.value.length);
  if(numeric) inp.addEventListener('input', () => fmtAmtInput(inp));
  let closed = false;
  const finish = keep => {
    if(closed) return;
    closed = true;
    if(keep) onSave(inp.value);
    commit();
    if(pendingEdit){ // 고치던 중 다른 칸을 누른 경우: 다시 그린 줄에서 그 칸을 바로 고침
      const { cid, kind } = pendingEdit; pendingEdit = null;
      const el = liveItems() && liveItems().querySelector(`.item[data-row="${cid}"] ${kind === 'nm' ? '.nm' : '.item-val'}`);
      if(el) (kind === 'nm' ? startNameEdit : startValueEdit)(el);
    }
  };
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter') inp.blur();
    if(e.key === 'Escape') finish(false);
  });
  inp.addEventListener('blur', () => finish(true));
}
function startValueEdit(box){
  const cid = box.dataset.cid, date = view.selected;
  const cur = state.snapshots[date]?.[cid];
  const d = box.querySelector('.d');
  if(d) d.remove();
  inlineEdit(box.querySelector('.val'), {
    value: cur === undefined ? '' : cur.toLocaleString('en-US'), numeric: true,
    onSave: v => applyValue(date, cid, v)
  });
}
function renameCategory(cid, raw){
  const name = raw.trim();
  const c = state.categories.find(x => x.id === cid);
  if(!c || !name || name === c.name) return;
  if(state.categories.some(x => x.id !== cid && x.name === name)){
    snack('같은 이름의 항목이 이미 있어요');
    return;
  }
  const date = view.selected;
  const earlier = sortedDates().some(d => d < date && state.snapshots[d][cid] !== undefined);
  if(!earlier){ c.name = name; return; } // 이전 기록이 없으면 그냥 바꿈
  // 다시 그린 뒤에 물음 (입력칸이 닫히고 나서 판이 올라오도록)
  setTimeout(() => pickOption({
    title: `'${c.name}' → '${name}'`,
    hint: `${fmtDay(date, false)} 이전 기록의 이름도 함께 바꿀까요? '부터만'을 고르면 이전 기록은 원래 이름으로 남아요.`,
    options: [
      { value: 'all', label: '이전 기록까지 모두 바꾸기' },
      { value: 'from', label: `${fmtDay(date, false)}부터만 바꾸기` }
    ],
    onPick: v => {
      if(state.categories.some(x => x.id !== cid && x.name === name)){ snack('같은 이름의 항목이 이미 있어요'); return; }
      if(v === 'all'){ c.name = name; }
      else{
        // 고른 날부터의 금액만 새 이름의 항목으로 옮김 (새 항목은 원래 항목 바로 아래 순서)
        const nc = { id: 'c' + Date.now().toString(36), name, color: PALETTE[state.categories.length % PALETTE.length] };
        state.categories.splice(state.categories.indexOf(c) + 1, 0, nc);

/* ---------- 백업 / 복원 ---------- */
function openText(mode, payloadText = ''){
  const ta = $('textArea');
  const copy = mode === 'copy';
  $('textTitle').textContent = copy ? '백업 데이터' : '백업 복원';
